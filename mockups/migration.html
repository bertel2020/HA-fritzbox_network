<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umsteigen – Mockup</title>
<style>
  /* ---------- Tokens wie panel-styles.js (Thema „Ozean“) ---------- */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f4f6f9, #0f1216);
    --surface: light-dark(#fff, #1b1f24);
    --soft: light-dark(#f5f7f9, #22272e);
    --line: light-dark(#e1e5ea, #2d333b);
    --input-line: light-dark(#c3cbd5, #3a424c);
    --text: light-dark(#1b1f24, #e6e9ed);
    --muted: light-dark(#5b6270, #9aa4b1);
    --accent: light-dark(#0a6aa8, #5bb2ea);
    --accent-hover: light-dark(#07507f, #8ccaf2);
    --accent-soft: light-dark(#eaf3fa, #16324a);
    --on-accent: light-dark(#fff, #0b1a26);
    --focus: #7db8e0;
    --up: light-dark(#7a4bc2, #b79af0);
    --ok: light-dark(#1e6b34, #7fd49a);
    --ok-soft: light-dark(#e6f4ea, #173a24);
    --warn: light-dark(#8a4b00, #f2c27a);
    --warn-soft: light-dark(#fff1de, #3a2a12);
    --bad: light-dark(#a1261b, #f2a29a);
    --bad-soft: light-dark(#fdecea, #3d1c19);
    --neutral-soft: light-dark(#eef1f4, #2a3038);
    --neutral-text: light-dark(#3a414c, #c5ccd5);
    --radius: 18px;
    --shadow-c: light-dark(rgb(16 24 40 / 14%), rgb(0 0 0 / 40%));
    --shadow: 0 1px 2px var(--shadow-c), 0 6px 18px -10px var(--shadow-c);
  }
  :root[data-mode="light"] { color-scheme: light; }
  :root[data-mode="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Roboto, "Noto Sans", system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .muted { color: var(--muted); }
  a, .linklike { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  /* Mockup-Leiste */
  .mockbar { max-width: 1200px; margin: 12px auto 0; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border-radius: 14px; background: var(--soft); border: 1px dashed var(--line); }
  .mockbar > span { flex: 1 1 260px; }
  .mockbar .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mockbar .ctl { min-width: 0; max-width: 100%; }
  .mockbar select { max-width: 100%; min-height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
  .seg button { padding: 0 12px; min-height: 34px; font-weight: 500; color: var(--muted); border-left: 1px solid var(--line); white-space: nowrap; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
  .wrap { max-width: 1200px; margin: 12px auto 40px; padding: 0 12px; }
  .frame { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow); }

  /* Kopf des Panels */
  .header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 0 24px; padding: 0 20px; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 60px; min-width: 0; flex: 1 1 auto; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-hover); display: grid; place-items: center; flex: none; }
  .brand b { display: block; font-size: 18px; font-weight: 500; line-height: 1.2; white-space: nowrap; }
  .brand small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; max-width: 100%; }
  nav button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; font-weight: 500; color: var(--muted); white-space: nowrap; border-radius: 22px; }
  nav button:hover { color: var(--text); background: var(--neutral-soft); }
  nav button[aria-selected="true"] { color: var(--accent-hover); background: var(--accent-soft); }
  nav button.new::after { content: "neu"; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); }
  nav .dot { width: 7px; height: 7px; }
  main { padding: 16px 20px 32px; display: grid; gap: 16px; }
  @media (max-width: 600px) { .header { padding: 0 12px; } main { padding: 12px 12px 24px; } }

  /* Bausteine wie im Panel */
  .phead h1 { font-size: 24px; font-weight: 500; margin: 4px 0 2px; letter-spacing: -.01em; }
  .lead { color: var(--muted); margin: 0; max-width: 75ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .sec { padding: 16px; }
  .sec > .label { display: block; margin-bottom: 10px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 11px; border-radius: 13px; background: var(--neutral-soft); color: var(--neutral-text); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--accent-soft); color: var(--accent-hover); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--input-line); flex: none; display: inline-block; }
  .dot.on { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 20px; font-weight: 500; white-space: nowrap; border: 1px solid var(--input-line); background: var(--surface); }
  .btn:hover { background: var(--soft); }
  .btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.dp { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  .btn.sm { min-height: 34px; padding: 0 14px; font-size: 13px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .switch { position: relative; width: 52px; height: 32px; border-radius: 16px; background: #aeb6c1; flex: none; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / 30%); }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .switch[disabled] { opacity: .55; cursor: default; }
  .switch.busy::after { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  .tile { background: var(--soft); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile b { display: block; font-size: 18px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile small { display: block; font-size: 12px; color: var(--muted); }
  .tile.warn b { color: var(--warn); }
  .tile .na { color: var(--muted); font-weight: 400; font-size: 14px; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .hintline { display: flex; align-items: center; gap: 10px; margin: 4px 0; font-size: 14px; }
  .hintline.bad { color: var(--bad); } .hintline.warn { color: var(--warn); } .hintline.info { color: var(--muted); }
  .empty { display: grid; justify-items: center; gap: 6px; padding: 40px 16px; text-align: center; color: var(--muted); }
  .empty b { color: var(--text); font-weight: 500; }
  .ihead { display: flex; align-items: center; gap: 12px; }
  .ihead .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-hover); flex: none; }
  .ihead .who { flex: 1; min-width: 0; }
  .ihead .who b { display: block; font-size: 16px; font-weight: 500; }
  .ihead .who small { color: var(--muted); }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
  .skel { background: linear-gradient(90deg, var(--soft), var(--neutral-soft), var(--soft)); background-size: 200% 100%; animation: sk 1.4s infinite; border-radius: 8px; color: transparent !important; }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel, .switch.busy::after { animation: none; } }

  /* Dialog und Toast wie panel-dialogs.js */
  .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 45%); display: none; place-items: center; z-index: 20; padding: 16px; }
  .backdrop.open { display: grid; }
  .dialog { background: var(--surface); border-radius: 22px; padding: 22px; max-width: 460px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 40px -12px rgb(0 0 0 / 45%); }
  .dialog h2 { font-size: 18px; font-weight: 500; margin: 0 0 10px; }
  .dialog ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .dialog .btn-row { justify-content: flex-end; margin-top: 20px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120px); background: var(--text); color: var(--surface); padding: 12px 16px; border-radius: 12px; transition: transform .2s; z-index: 30; max-width: calc(100% - 32px); display: flex; gap: 14px; align-items: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast button { color: var(--accent-soft); font-weight: 600; text-decoration: underline; }

  /* Dashboard-Karte */
  .dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
  .hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
  .chead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .chead b { font-size: 16px; font-weight: 500; flex: 1; }
  .mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .notes { font-size: 13px; color: var(--muted); margin: 8px 2px 0; padding-left: 18px; }
  .notes li { margin: 3px 0; } .notes b { color: var(--text); font-weight: 500; }
  [hidden] { display: none !important; }
  /* Umsteigen */
  .subtabs { margin-bottom: 4px; }
  .banner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 14px; align-items: center; padding: 14px 16px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
  .banner.info { background: var(--accent-soft); color: var(--accent-hover); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .banner.ok { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .banner b { display: block; color: var(--text); font-weight: 500; }
  .banner span.t { color: var(--text); font-size: 13px; }
  .banner .btn-row { margin: 0; }
  @media (max-width: 700px) { .banner { grid-template-columns: auto minmax(0, 1fr); } .banner .btn-row { grid-column: 1 / -1; } }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; counter-reset: s; }
  .steps li { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 20px; background: var(--soft); color: var(--muted); font-weight: 500; font-size: 13px; counter-increment: s; }
  .steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--neutral-soft); font-size: 12px; }
  .steps li.done::before { content: "✓"; background: var(--ok-soft); color: var(--ok); }
  .steps li[aria-current="step"] { background: var(--accent-soft); color: var(--accent-hover); }
  .steps li[aria-current="step"]::before { background: var(--accent); color: var(--on-accent); }
  .tiles .tile.ok b { color: var(--ok); } .tiles .tile.bad b { color: var(--bad); } .tiles .tile.warn b { color: var(--warn); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
  .fchip em { font-style: normal; color: var(--muted); }
  .fchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .map { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .map .grp { padding: 8px 14px; background: var(--soft); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .mrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 20px minmax(0, 1fr) 150px; gap: 4px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .mhead { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-top: 0; padding-top: 8px; padding-bottom: 8px; }
  .mrow .ent { min-width: 0; }
  .mrow .ent b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .ent .mono { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .mrow .arrow { color: var(--muted); text-align: center; }
  .mrow .why { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
  .mrow .why.warn { color: var(--warn); } .mrow .why.bad { color: var(--bad); }
  .mrow.dim .ent { opacity: .65; }
  .mrow select { min-height: 32px; border-radius: 8px; border: 1px solid var(--input-line); background: var(--surface); padding: 0 8px; font-size: 13px; max-width: 100%; }
  .mrow input[type="checkbox"], .opt input { width: 18px; height: 18px; accent-color: var(--accent); }
  @media (max-width: 760px) {
    .mhead { display: none; }
    .mrow { grid-template-columns: 28px minmax(0, 1fr); }
    .mrow .arrow { display: none; }
    .mrow .ent.to { grid-column: 2; }
    .mrow .ent.to::before { content: "→ FRITZ!Box Netzwerk"; display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .mrow .st { grid-column: 2; }
    .mrow .ent b { white-space: normal; overflow-wrap: anywhere; }
  }
  .opts { display: grid; gap: 10px; }
  .opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
  .opt b { font-weight: 500; display: block; }
  .opt small { color: var(--muted); font-size: 12px; }
  .bar { height: 8px; border-radius: 4px; background: var(--neutral-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
  ol.todo { overflow-wrap: anywhere; margin: 0; padding-left: 20px; display: grid; gap: 14px; }
  ol.todo li b { font-weight: 500; }
  ol.todo li p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .log { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; max-height: 180px; overflow: auto; }
  .log li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 4px 0; }
  .log li .ok { color: var(--ok); } .log li .bad { color: var(--bad); }
  .stack { display: grid; gap: 16px; }
</style>
</head>
<body>
<div class="mockbar">
  <span class="muted">Mockup „Von FRITZ!Box Tools umsteigen“: Hinweis bei doppeltem Betrieb und Assistent unter <b>Verwalten › Umsteigen</b>. Nichts wird gelöscht; FRITZ!Box Tools entfernt der Nutzer am Ende selbst.</span>
  <div class="ctl">
    <label class="sr" for="st">Zustand</label>
    <select id="st">
      <option value="banner">Hinweis auf der Seite Netzwerk</option>
      <option value="scan">1 · Prüfen läuft</option>
      <option value="preview" selected>2 · Vorschau mit Konflikten</option>
      <option value="run">3 · Übernahme läuft</option>
      <option value="done">4 · Fertig</option>
      <option value="error">Fehler beim Prüfen</option>
      <option value="none">Kein FRITZ!Box Tools gefunden</option>
      <option value="other">FRITZ!Box Tools für eine andere Box</option>
      <option value="disabled">FRITZ!Box Tools deaktiviert</option>
    </select>
    <span class="seg" role="group" aria-label="Farbschema">
      <button data-mode="auto" aria-pressed="true">System</button>
      <button data-mode="light" aria-pressed="false">Hell</button>
      <button data-mode="dark" aria-pressed="false">Dunkel</button>
    </span>
  </div>
</div>

<div class="wrap">
  <div class="frame">
    <header class="header">
      <div class="brand">
        <div class="logo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 17h.01M12 14V9M9 9a4.2 4.2 0 0 1 6 0"/></svg></div>
        <div><b>FRITZ!Box Netzwerk</b><small>FRITZ-RM · FRITZ!Box 7590 AX</small></div>
      </div>
      <nav role="tablist" aria-label="Seiten" id="nav"></nav>
    </header>
    <main id="main"></main>
  </div>
</div>

<div class="backdrop" id="backdrop"><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const I = {
    alert: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',
    swap: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>',
    check: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
    ext: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    archive: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg>',
  };

  /* ---------- Vorschau (migrate/scan) ---------- */
  // status: migrate = übernehmen, none = kein Gegenstück, skip = übersprungen, conflict = Konflikt
  const R = (group, core, name, target, status, why = "", tone = "", extra = {}) => ({ group, core, name, target, status, why, tone, pick: status === "migrate", ...extra });
  const ROWS = [
    R("Box", "binary_sensor.fritz_box_7590_ax_connection", "Verbindung", "binary_sensor.fritz_network_internet_connected", "migrate", "In 2 Automationen benutzt; sie laufen mit der alten ID weiter."),
    R("Box", "binary_sensor.fritz_box_7590_ax_link", "Link", "binary_sensor.fritz_network_wan_link", "migrate", "Neue Entität, wird eingeschaltet."),
    R("Box", "button.fritz_box_7590_ax_reboot", "Neustart", "button.fritz_network_reboot", "migrate", "Bei uns standardmäßig aus, wird eingeschaltet."),
    R("Box", "button.fritz_box_7590_ax_reconnect", "Neu verbinden", "button.fritz_network_reconnect", "migrate"),
    R("Box", "sensor.fritz_box_7590_ax_external_ip", "Externe IP", "sensor.fritz_network_external_ipv4", "migrate"),
    R("Box", "sensor.fritz_box_7590_ax_last_restart", "Letzter Neustart", "sensor.fritz_network_last_restart", "migrate"),
    R("Box", "sensor.fritz_box_7590_ax_cpu_temperature", "CPU-Temperatur", "sensor.fritz_network_cpu_temperature", "migrate"),
    R("Box", "sensor.fritz_box_7590_ax_download_throughput", "Download-Durchsatz", "sensor.fritz_network_download_throughput", "migrate", "Einheit wechselt von kB/s zu Mbit/s: Der Verlauf bleibt, die Langzeitstatistik beginnt neu.", "warn"),
    R("Box", "sensor.fritz_box_7590_ax_gb_received", "GB empfangen", "sensor.fritz_network_bytes_received", "migrate"),
    R("Box", "update.fritz_box_7590_ax_fritz_os", "FRITZ!OS", "update.fritz_network_firmware", "migrate", "Installieren bleibt in der Box; die Entität zeigt nur an."),
    R("Box", "button.fritz_box_7590_ax_firmware_update", "Firmware-Update", null, "none", "Firmware installieren geht nur in der Box."),

  const chip = (r) => ({ migrate: `<span class="chip ok">übernehmen</span>`, conflict: `<span class="chip bad">Konflikt</span>`, none: `<span class="chip">kein Gegenstück</span>`, skip: `<span class="chip">übersprungen</span>` }[r.status]);

        <label class="opt"><input type="checkbox" data-opt="ids" ${opt.ids ? "checked" : ""}><span><b>Entity-IDs übernehmen</b><small>Automationen, Skripte, Szenen, Dashboards und der Verlauf laufen mit den alten IDs weiter.</small></span></label>

  const LOG = ["binary_sensor.fritz_box_7590_ax_connection", "binary_sensor.fritz_box_7590_ax_link", "button.fritz_box_7590_ax_reboot", "button.fritz_box_7590_ax_reconnect", "sensor.fritz_box_7590_ax_external_ip", "sensor.fritz_box_7590_ax_last_restart", "sensor.fritz_box_7590_ax_cpu_temperature", "device_tracker.iphone_roberto", "device_tracker.laptop_anna", "device_tracker.tv_wohnzimmer"];

  function empty(kind) {
    const m = {
      none: [I.check, "FRITZ!Box Tools ist nicht eingerichtet.", "Es gibt nichts zu übernehmen. Diese Seite fehlt im fertigen Panel dann im Menü; hier erreichbar über den Link in der Anleitung."],

      <div class="banner ok" role="region" aria-label="Hinweis">${I.check}<div><b>Umstieg fertig. Entferne jetzt FRITZ!Box Tools.</b><span class="t">Bis dahin wird die Box doppelt abgefragt. Das Panel löscht nichts selbst.</span></div><div class="btn-row"><a class="btn p sm" href="#">${I.ext}FRITZ!Box Tools öffnen</a><button class="btn sm" data-act="later">Später</button></div></div>

  function draw() {
    if (state === "banner") return bannerView();

    const v = { scan: scanning, preview, run: running, done: doneView }[state];
    $("#main").innerHTML = v ? v() : empty(state);

  /* ---------- Dialog und Toast ---------- */
  function dialog({ title, body, list, ok, danger }) {
    return new Promise((resolve) => {
      const before = document.activeElement;
      $("#dialog").innerHTML = `<h2 id="dlg-title">${esc(title)}</h2><div>${body}</div>${list ? `<ul>${list.map((l) => `<li>${l}</li>`).join("")}</ul>` : ""}
        <div class="btn-row"><button class="btn" id="dlg-no">Abbrechen</button><button class="btn ${danger ? "dp" : "p"}" id="dlg-yes">${esc(ok)}</button></div>`;
      $("#backdrop").classList.add("open"); $("#dlg-no").focus();
      const done = (v) => { $("#backdrop").classList.remove("open"); document.removeEventListener("keydown", key); before?.focus?.(); resolve(v); };
      const key = (e) => { if (e.key === "Escape") done(false); if (e.key === "Tab") { e.preventDefault(); (document.activeElement === $("#dlg-no") ? $("#dlg-yes") : $("#dlg-no")).focus(); } };
      document.addEventListener("keydown", key);
      $("#dlg-no").onclick = () => done(false); $("#dlg-yes").onclick = () => done(true);
    });
  }
  let tt;
  function toast(msg) { $("#toast").textContent = msg; $("#toast").classList.add("show"); clearTimeout(tt); tt = setTimeout(() => $("#toast").classList.remove("show"), 4500); }

  function setState(s) { state = s; $("#st").value = s; clearInterval(timer); if (s === "run") startRun(); draw(); }
  function startRun() {
    run = 0;
    timer = setInterval(() => { run += 3; if (run >= 52) { clearInterval(timer); setState("done"); return; } draw(); }, 250);
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button, a");
    if (!b || b.closest("#dialog")) return;
    if (b.dataset.mode) {
      document.documentElement.dataset.mode = b.dataset.mode === "auto" ? "" : b.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); return;
    }
    if (b.tagName === "A") e.preventDefault();
    if (b.dataset.f) { filter = b.dataset.f; draw(); return; }
    if (b.dataset.goto) return setState(b.dataset.goto);
    if (b.dataset.act === "later") { toast("Ausgeblendet für 30 Tage in diesem Browser."); return; }
    if (b.dataset.act === "rescan") { setState("scan"); setTimeout(() => setState("preview"), 1200); return; }
    if (b.dataset.act === "start") {
      const ok = await dialog({
        title: "52 Entitäten übernehmen?",
        body: "Das ändert die Entity-Registry von Home Assistant:",
        list: [
          "<b>52</b> Entitäten von FRITZ!Box Netzwerk bekommen die ID und die Anpassungen ihrer Vorgänger.",
          opt.disable ? "Die alten Entitäten werden <b>deaktiviert, nicht gelöscht</b>." : "Die alten Entitäten bleiben aktiv, mit der Endung <span class=\"mono\">_fritz_tools</span>.",
          "<b>4</b> ohne Gegenstück und <b>3</b> übersprungene bleiben unverändert.",
          "FRITZ!Box Tools bleibt eingerichtet; entfernen musst du sie danach selbst.",
          "Letztes Backup: heute, 03:00.",
        ],
        ok: "Übernehmen",
      });
      if (ok) setState("run");
      return;
    }
    if (b.dataset.act === "undo") {
      const ok = await dialog({ title: "Übernahme rückgängig machen?", body: "Die 50 übernommenen Entitäten bekommen ihre vorherigen IDs zurück, die alten von FRITZ!Box Tools werden wieder aktiviert. Automationen nutzen dann wieder die Entitäten von FRITZ!Box Tools.", ok: "Rückgängig machen", danger: true });
      if (ok) { toast("Rückgängig gemacht. Die Vorschau zeigt den Stand von vorher."); setState("preview"); }
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "st") return setState(t.value);
    if (t.dataset.pick) { ROWS[t.dataset.pick].pick = t.checked; draw(); }
    if (t.dataset.choice) { ROWS[t.dataset.choice].choice = t.value; draw(); }
    if (t.dataset.opt) { opt[t.dataset.opt] = t.checked; }
  });
  draw();
</script>
</body>
</html>
