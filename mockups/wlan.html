<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WLAN – Mockup</title>
<style>
  /* ---------- Tokens wie panel-styles.js (Thema „Ozean“) ---------- */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f4f6f9, #0f1216);
    --surface: light-dark(#fff, #1b1f24);
    --soft: light-dark(#f5f7f9, #22272e);
    --line: light-dark(#e1e5ea, #2d333b);
    --input-line: light-dark(#c3cbd5, #3a424c);
    --text: light-dark(#1b1f24, #e6e9ed);
    --muted: light-dark(#5b6270, #9aa4b1);
    --accent: light-dark(#0a6aa8, #5bb2ea);
    --accent-hover: light-dark(#07507f, #8ccaf2);
    --accent-soft: light-dark(#eaf3fa, #16324a);
    --on-accent: light-dark(#fff, #0b1a26);
    --focus: #7db8e0;
    --up: light-dark(#7a4bc2, #b79af0);
    --ok: light-dark(#1e6b34, #7fd49a);
    --ok-soft: light-dark(#e6f4ea, #173a24);
    --warn: light-dark(#8a4b00, #f2c27a);
    --warn-soft: light-dark(#fff1de, #3a2a12);
    --bad: light-dark(#a1261b, #f2a29a);
    --bad-soft: light-dark(#fdecea, #3d1c19);
    --neutral-soft: light-dark(#eef1f4, #2a3038);
    --neutral-text: light-dark(#3a414c, #c5ccd5);
    --radius: 18px;
    --shadow-c: light-dark(rgb(16 24 40 / 14%), rgb(0 0 0 / 40%));
    --shadow: 0 1px 2px var(--shadow-c), 0 6px 18px -10px var(--shadow-c);
  }
  :root[data-mode="light"] { color-scheme: light; }
  :root[data-mode="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Roboto, "Noto Sans", system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .muted { color: var(--muted); }
  a, .linklike { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  /* Mockup-Leiste */
  .mockbar { max-width: 1200px; margin: 12px auto 0; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border-radius: 14px; background: var(--soft); border: 1px dashed var(--line); }
  .mockbar > span { flex: 1 1 260px; }
  .mockbar .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mockbar .ctl { min-width: 0; max-width: 100%; }
  .mockbar select { max-width: 100%; min-height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
  .subtabs { margin-bottom: 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
  .seg button { padding: 0 12px; min-height: 34px; font-weight: 500; color: var(--muted); border-left: 1px solid var(--line); white-space: nowrap; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
  .wrap { max-width: 1200px; margin: 12px auto 40px; padding: 0 12px; }
  .frame { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow); }

  /* Kopf des Panels */
  .header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 0 24px; padding: 0 20px; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 60px; min-width: 0; flex: 1 1 auto; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-hover); display: grid; place-items: center; flex: none; }
  .brand b { display: block; font-size: 18px; font-weight: 500; line-height: 1.2; white-space: nowrap; }
  .brand small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; max-width: 100%; }
  nav button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; font-weight: 500; color: var(--muted); white-space: nowrap; border-radius: 22px; }
  nav button:hover { color: var(--text); background: var(--neutral-soft); }
  nav button[aria-selected="true"] { color: var(--accent-hover); background: var(--accent-soft); }
  nav button.new::after { content: "neu"; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); }
  nav .dot { width: 7px; height: 7px; }
  main { padding: 16px 20px 32px; display: grid; gap: 16px; }
  @media (max-width: 600px) { .header { padding: 0 12px; } main { padding: 12px 12px 24px; } }

  /* Bausteine wie im Panel */
  .phead h1 { font-size: 24px; font-weight: 500; margin: 4px 0 2px; letter-spacing: -.01em; }
  .lead { color: var(--muted); margin: 0; max-width: 75ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .sec { padding: 16px; }
  .sec > .label { display: block; margin-bottom: 10px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 11px; border-radius: 13px; background: var(--neutral-soft); color: var(--neutral-text); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--accent-soft); color: var(--accent-hover); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--input-line); flex: none; display: inline-block; }
  .dot.on { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 20px; font-weight: 500; white-space: nowrap; border: 1px solid var(--input-line); background: var(--surface); }
  .btn:hover { background: var(--soft); }
  .btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.dp { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  .btn.sm { min-height: 34px; padding: 0 14px; font-size: 13px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .switch { position: relative; width: 52px; height: 32px; border-radius: 16px; background: #aeb6c1; flex: none; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / 30%); }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .switch[disabled] { opacity: .55; cursor: default; }
  .switch.busy::after { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  .tile { background: var(--soft); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile b { display: block; font-size: 18px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile small { display: block; font-size: 12px; color: var(--muted); }
  .tile.warn b { color: var(--warn); }
  .tile .na { color: var(--muted); font-weight: 400; font-size: 14px; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .hintline { display: flex; align-items: center; gap: 10px; margin: 4px 0; font-size: 14px; }
  .hintline.bad { color: var(--bad); } .hintline.warn { color: var(--warn); } .hintline.info { color: var(--muted); }
  .empty { display: grid; justify-items: center; gap: 6px; padding: 40px 16px; text-align: center; color: var(--muted); }
  .empty b { color: var(--text); font-weight: 500; }
  .ihead { display: flex; align-items: center; gap: 12px; }
  .ihead .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-hover); flex: none; }
  .ihead .who { flex: 1; min-width: 0; }
  .ihead .who b { display: block; font-size: 16px; font-weight: 500; }
  .ihead .who small { color: var(--muted); }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
  .skel { background: linear-gradient(90deg, var(--soft), var(--neutral-soft), var(--soft)); background-size: 200% 100%; animation: sk 1.4s infinite; border-radius: 8px; color: transparent !important; }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel, .switch.busy::after { animation: none; } }

  /* Dialog und Toast wie panel-dialogs.js */
  .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 45%); display: none; place-items: center; z-index: 20; padding: 16px; }
  .backdrop.open { display: grid; }
  .dialog { background: var(--surface); border-radius: 22px; padding: 22px; max-width: 460px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 40px -12px rgb(0 0 0 / 45%); }
  .dialog h2 { font-size: 18px; font-weight: 500; margin: 0 0 10px; }
  .dialog ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .dialog .btn-row { justify-content: flex-end; margin-top: 20px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120px); background: var(--text); color: var(--surface); padding: 12px 16px; border-radius: 12px; transition: transform .2s; z-index: 30; max-width: calc(100% - 32px); display: flex; gap: 14px; align-items: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast button { color: var(--accent-soft); font-weight: 600; text-decoration: underline; }

  /* Dashboard-Karte */
  .dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
  .hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
  .chead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .chead b { font-size: 16px; font-weight: 500; flex: 1; }
  .mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .notes { font-size: 13px; color: var(--muted); margin: 8px 2px 0; padding-left: 18px; }
  .notes li { margin: 3px 0; } .notes b { color: var(--text); font-weight: 500; }
  [hidden] { display: none !important; }
  /* WLAN-Seite */
  .net { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .net:first-of-type { border-top: 0; }
  .net .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-hover); }
  .net.off .ico { background: var(--soft); color: var(--muted); }
  .net.off .n { opacity: .6; }
  .net .n b { font-weight: 500; display: block; overflow-wrap: anywhere; }
  .net .n small { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .net .end { display: flex; align-items: center; gap: 10px; }
  .net .end .chip { display: none; }
  @media (min-width: 640px) { .net .end .chip { display: inline-flex; } }
  .guest { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 20px; align-items: start; }
  @media (max-width: 720px) { .guest { grid-template-columns: minmax(0, 1fr); } }
  .qrbox { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; justify-items: center; gap: 10px; background: var(--soft); text-align: center; }
  .qr { width: 180px; height: 180px; background: #fff; border-radius: 10px; padding: 8px; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qrveil { width: 180px; height: 180px; border-radius: 10px; display: grid; place-items: center; background: repeating-linear-gradient(45deg, var(--neutral-soft) 0 8px, var(--soft) 8px 16px); color: var(--muted); font-size: 13px; padding: 12px; }
  .secret { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .secret .mono { font-size: 15px; letter-spacing: .04em; padding: 4px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
  .iconbtn { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--muted); }
  .iconbtn:hover { background: var(--neutral-soft); color: var(--text); }
  .iconbtn[aria-pressed="true"] { color: var(--accent-hover); background: var(--accent-soft); }
  dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0 0; font-size: 13px; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  .field { display: grid; gap: 4px; margin-top: 12px; }
  .field label { font-size: 12px; color: var(--muted); }
  .pw { display: flex; align-items: center; border: 1px solid var(--input-line); border-radius: 10px; background: var(--surface); padding-right: 2px; }
  .pw:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
  .pw input { flex: 1; min-width: 0; min-height: 40px; border: 0; background: transparent; padding: 0 10px; outline: none; font-family: ui-monospace, Menlo, monospace; }
  .rules { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
  .rules li { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .rules li::before { content: "○"; width: 14px; text-align: center; }
  .rules li.ok { color: var(--ok); } .rules li.ok::before { content: "✓"; }
  .rules li.bad { color: var(--bad); } .rules li.bad::before { content: "✕"; }
  .warnbox { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13px; background: var(--warn-soft); color: var(--warn); margin-top: 14px; }
  .dialog.wide { max-width: 500px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="mockbar">
  <span class="muted">Mockup der neuen Seite <b>WLAN</b> (eigener Reiter). Schalter, QR-Code und Passwortdialog sind simuliert; der QR-Code ist ein Muster, nicht scannbar. Beispiel: FRITZ!Box 7590 AX mit zwei Repeatern.</span>
  <div class="ctl">
    <label class="sr" for="st">Zustand</label>
    <select id="st">
      <option value="ok">Normal</option>
      <option value="loading">Lädt</option>
      <option value="error">Fehler beim Lesen</option>
      <option value="ro">Nur lesen (kein Recht)</option>
      <option value="noguest">Kein Gastzugang eingerichtet</option>
      <option value="nowlan">Box nennt kein WLAN (z. B. als Mesh-Repeater)</option>
    </select>
    <span class="seg" role="group" aria-label="Ansicht">
      <button data-view="panel" aria-pressed="true">Panel</button>
      <button data-view="dash" aria-pressed="false">Dashboard-Karte</button>
    </span>
    <span class="seg" role="group" aria-label="Farbschema">
      <button data-mode="auto" aria-pressed="true">System</button>
      <button data-mode="light" aria-pressed="false">Hell</button>
      <button data-mode="dark" aria-pressed="false">Dunkel</button>
    </span>
  </div>
</div>

<div class="wrap">
  <div class="frame">
    <header class="header">
      <div class="brand">
        <div class="logo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 17h.01M12 14V9M9 9a4.2 4.2 0 0 1 6 0"/></svg></div>
        <div><b>FRITZ!Box Netzwerk</b><small>FRITZ-RM · FRITZ!Box 7590 AX</small></div>
      </div>
      <nav role="tablist" aria-label="Seiten" id="nav"></nav>
    </header>
    <main id="main"></main>
  </div>
</div>

<div class="backdrop" id="backdrop"><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const I = {
    wifi: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a15 15 0 0 1 20 0M12 19.5h.01"/></svg>',
    guest: '<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5a6.5 6.5 0 0 1 3 5.5"/></svg>',
    eye: '<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
    copy: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
    print: '<svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7"/></svg>',
    dice: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/></svg>',
    alert: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',
    lock: '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  };

  /* ---------- Beispieldaten (wlan/list) ---------- */
  let nets = [
    { id: "wlan1", band: "2,4 GHz", ssid: "FRITZ-RM", enabled: true, channel: 6, sec: "WPA2 + WPA3", clients: 14 },
    { id: "wlan2", band: "5 GHz", ssid: "FRITZ-RM", enabled: true, channel: 44, sec: "WPA2 + WPA3", clients: 17 },
  ];
  let guest = { id: "wlan3", ssid: "FRITZ!Box Gastzugang", enabled: true, sec: "WPA2", clients: 2, bands: "2,4 + 5 GHz", isolation: true, autoOff: "nach 6 Std. ohne Gerät" };
  // the secret comes only from wlan/guest/secret, on demand, and is dropped when the page is left
  let secret = null, reveal = false, qrBusy = false;
  let state = "ok", view = "panel";
  const busy = new Set();

  function nav(active) {
    const tabs = [["net", "Netzwerk"], ["internet", "Internet", '<i class="dot on" aria-hidden="true"></i>'], ["box", "Box"], ["diagnose", "Diagnose"], ["devices", "Verwalten"]];
    $("#nav").innerHTML = tabs.map(([id, name, extra = "", isNew]) => `<button role="tab" class="${isNew ? "new" : ""}" aria-selected="${id === active}">${name}${extra}</button>`).join("");
  }

  const subtabs = (label, items, active) => `<div class="seg subtabs" role="tablist" aria-label="${label}">${items.map((n) => `<button role="tab" aria-selected="${n === active}">${n}</button>`).join("")}</div>`;

  /* A pattern that looks like a QR code: three finder squares and a deterministic noise. Not scannable. */
  function fakeQr(seed) {
    const n = 29; let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const rnd = () => ((h = (h * 1103515245 + 12345) >>> 0) >>> 16) & 1;
    const finder = (x, y) => [[0, 0], [n - 7, 0], [0, n - 7]].some(([fx, fy]) => x >= fx - 1 && x <= fx + 7 && y >= fy - 1 && y <= fy + 7);
    let r = "";
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!finder(x, y) && rnd()) r += `M${x} ${y}h1v1h-1z`;
    const f = (x, y) => `M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}v5h5v-5zM${x + 2} ${y + 2}h3v3h-3z`;
    return `<svg viewBox="0 0 ${n} ${n}" role="img" aria-label="QR-Code zum Verbinden mit ${esc(guest.ssid)}" shape-rendering="crispEdges"><path fill="#111" fill-rule="evenodd" d="${r}${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}"/></svg>`;
  }

  /* ---------- Seite ---------- */
  function netRow(n) {
    const ro = state === "ro";
    const b = busy.has(n.id);
    return `<div class="net ${n.enabled ? "" : "off"}">
      <span class="ico">${I.wifi}</span>
      <div class="n"><b>${esc(n.ssid)} <span class="muted" style="font-weight:400">· ${n.band}</span></b>
        <small><span>${n.enabled ? `Kanal ${n.channel}` : "aus"}</span><span>${n.sec}</span><span>${n.enabled ? `${n.clients} Geräte` : ""}</span>${b ? `<span style="color:var(--accent)">wird geschaltet …</span>` : ""}</small></div>
      <div class="end"><span class="chip ${n.enabled ? "ok" : ""}">${n.enabled ? "an" : "aus"}</span>
        <button class="switch ${b ? "busy" : ""}" role="switch" aria-checked="${n.enabled}" aria-label="WLAN ${esc(n.ssid)}, ${n.band}" data-net="${n.id}"${ro || b ? " disabled" : ""}></button></div></div>`;
  }

  function netsCard() {
    if (state === "loading") return `<section class="card sec" aria-busy="true"><span class="label">Funknetze der Box</span>${[1, 2].map(() => `<div class="net"><span class="ico"></span><div class="n"><b class="skel" style="width:160px">FRITZ-RM</b><small class="skel" style="width:220px;margin-top:4px">lädt</small></div><span class="skel" style="width:52px;height:32px;border-radius:16px"></span></div>`).join("")}</section>`;
    const same = nets.every((n) => n.ssid === nets[0].ssid);
    const allOff = nets.every((n) => !n.enabled);
    return `<section class="card sec"><span class="label">Funknetze der Box</span>
      ${allOff ? `<p class="hintline warn">${I.alert}<span>Kein Funknetz der Box ist an. Geräte kommen nur noch über LAN, den Gastzugang oder die Repeater ins Netz.</span></p>` : ""}
      ${nets.map(netRow).join("")}
      <p class="hint">${same ? "Beide Bänder haben denselben Namen: Die Geräte wählen das Band selbst. Schaltest du eines aus, wechseln sie auf das andere. " : ""}Die Repeater im Mesh übernehmen die Einstellung der Box nach etwa einer Minute.${state === "ro" ? " <b>Nur zur Ansicht:</b> Schalten braucht das Recht „FRITZ!Box Einstellungen“." : ""}</p></section>`;
  }

  function guestCard() {
    const ro = state === "ro";
    if (state === "loading") return `<section class="card sec"><span class="label">Gastzugang</span><p class="hint">Wird geladen …</p></section>`;
    if (state === "noguest") return `<section class="card sec"><span class="label">Gastzugang</span><div class="empty" style="padding:28px 8px"><span>${I.guest}</span><b>Die Box hat keinen Gastzugang eingerichtet.</b><span>Einrichten geht in der Box unter WLAN › Gastzugang. Danach erscheint er hier von selbst.</span></div></section>`;
    const b = busy.has(guest.id);
    let qr;
    if (ro) qr = `<div class="qrveil">${I.lock}<span>QR-Code und Passwort brauchen das Recht „FRITZ!Box Einstellungen“.</span></div>`;
    else if (!guest.enabled) qr = `<div class="qrveil"><span>Der Gastzugang ist aus. Schalte ihn ein, um den QR-Code zu zeigen.</span></div>`;
    else if (!secret) qr = `<div class="qrveil"><span>Der QR-Code enthält das Passwort. Er wird erst auf Wunsch geladen.</span></div><button class="btn p sm" data-act="qr"${qrBusy ? " disabled" : ""}>${qrBusy ? "Wird geladen …" : "QR-Code zeigen"}</button>`;
    else qr = `<div class="qr">${fakeQr(guest.ssid + secret)}</div>
      <div class="secret"><span class="mono" id="pwtext" aria-label="Passwort">${reveal ? esc(secret) : "•".repeat(12)}</span>
        <button class="iconbtn" data-act="reveal" aria-pressed="${reveal}" aria-controls="pwtext" title="${reveal ? "Passwort verbergen" : "Passwort anzeigen"}" aria-label="Passwort anzeigen">${reveal ? I.eyeOff : I.eye}</button>
        <button class="iconbtn" data-act="copy" title="Passwort kopieren" aria-label="Passwort kopieren">${I.copy}</button></div>
      <div class="btn-row" style="margin-top:0;justify-content:center"><button class="btn sm" data-act="print">${I.print}Gastkarte drucken</button><button class="btn sm" data-act="hideqr">Verbergen</button></div>`;
    return `<section class="card sec"><span class="label">Gastzugang</span>
      <div class="guest"><div>
        <div class="net ${guest.enabled ? "" : "off"}" style="border-top:0;padding-top:0">
          <span class="ico">${I.guest}</span>
          <div class="n"><b>${esc(guest.ssid)}</b><small><span>${guest.bands}</span><span>${guest.sec}</span><span>${guest.enabled ? `${guest.clients} Gäste` : "aus"}</span>${b ? `<span style="color:var(--accent)">wird geschaltet …</span>` : ""}</small></div>
          <div class="end"><button class="switch ${b ? "busy" : ""}" role="switch" aria-checked="${guest.enabled}" aria-label="Gastzugang ${esc(guest.ssid)}" data-net="${guest.id}"${ro || b ? " disabled" : ""}></button></div></div>
        <dl class="kv">
          <dt>Gäste untereinander</dt><dd>${guest.isolation ? "getrennt" : "sehen sich"}</dd>
          <dt>Zugriff</dt><dd>nur Internet, nicht das Heimnetz</dd>
          <dt>Automatisch aus</dt><dd>${guest.autoOff}</dd>
          <dt>Passwort zuletzt geändert</dt><dd>${guest.changed ?? "vor 7 Monaten (von der Box)"}</dd>
        </dl>
        <div class="btn-row">${ro ? "" : `<button class="btn" data-act="pw">Passwort ändern …</button>`}</div>
        <p class="hint">Diese Einstellungen ändern geht in der Box unter WLAN › Gastzugang. Hier nur an, aus und das Passwort. Als Entität: <span class="mono">switch.fritz_network_guest_wifi</span>${ro ? "" : ", der QR-Code optional als <span class=\"mono\">image.fritz_network_guest_wifi_qr</span> (standardmäßig aus)"}.</p>
      </div>
      <div class="qrbox">${qr}</div></div></section>`;
  }

  function renderPanel() {
    nav("net");
    const head = `${subtabs("Netzwerk", ["Geräte", "WLAN", "Adressraum", "Routen"], "WLAN")}<div class="phead"><h1 id="dtitle" tabindex="-1">WLAN</h1><p class="lead">Die Funknetze der Box ein- und ausschalten, den Gastzugang teilen. Kanal, Auslastung und Rauschen je Access Point stehen weiter unter Netzwerk › Geräte.</p></div>`;
    if (state === "error") { $("#main").innerHTML = head + `<section class="card"><div class="empty"><span style="color:var(--bad)">${I.alert}</span><b>Die Box hat die WLAN-Einstellungen nicht genannt.</b><span class="mono" style="font-size:12px">UPnPError 401: Invalid Action (WLANConfiguration3)</span><div class="btn-row"><button class="btn p">Erneut versuchen</button></div></div></section>`; return; }
    if (state === "nowlan") { $("#main").innerHTML = head + `<section class="card"><div class="empty">${I.wifi}<b>Diese Box nennt kein eigenes WLAN.</b><span>Das ist so, wenn sie als Mesh-Repeater oder IP-Client arbeitet oder kein WLAN hat. Die Funknetze stellt dann das Gerät ein, das die Mesh-Master-Rolle hat.</span></div></section>`; return; }
    $("#main").innerHTML = `${head}${netsCard()}${guestCard()}`;
  }

  /* ---------- Dashboard-Karte ---------- */
  function renderDash() {
    nav("net");
    $("#main").innerHTML = `<div class="phead"><h1>Dashboard-Karte</h1><p class="lead"><span class="mono">custom:fritzbox-network-guest-card</span>: der Gastzugang zum Teilen, etwa auf einem Tablet im Flur.</p></div>
    <div class="dash"><div>
      <div class="hcard">
        <div class="chead">${I.guest}<b>Gäste-WLAN</b><button class="switch" role="switch" aria-checked="${guest.enabled}" aria-label="Gastzugang" data-net="${guest.id}"></button></div>
        ${guest.enabled ? `<div style="display:grid;justify-items:center;gap:8px"><div class="qr">${fakeQr(guest.ssid + "x")}</div>
          <b>${esc(guest.ssid)}</b><span class="muted" style="font-size:13px">Kamera auf den Code richten, um dich zu verbinden.</span></div>`
          : `<div class="empty" style="padding:20px 8px"><b>Der Gastzugang ist aus.</b></div>`}
      </div>
      <ul class="notes">
        <li><b>QR-Code</b> nur, wenn die Entität <span class="mono">image.fritz_network_guest_wifi_qr</span> eingeschaltet ist. Sie ist standardmäßig aus, weil <b>jeder Benutzer von Home Assistant</b> sie sehen kann; der Karteneditor sagt das beim Einschalten.</li>
        <li><b>Kein Passwort als Text</b> auf der Karte; Ändern nur im Panel.</li>
        <li><b>Schalter</b> nur für Administratoren und mit Recht, sonst nur der Zustand.</li>
      </ul></div>
      <div>
      <div class="hcard">
        <div class="chead">${I.guest}<b>Gäste-WLAN</b><span class="chip ok">an · 2 Gäste</span></div>
        <div class="qrveil" style="width:100%;height:auto;min-height:120px">QR-Code ausgeschaltet. Einschalten: Entität <span class="mono">image.fritz_network_guest_wifi_qr</span> aktivieren.</div>
      </div>
      <ul class="notes"><li><b>Ohne die Bild-Entität</b> zeigt die Karte den Zustand und einen Hinweis statt des Codes.</li></ul>
      </div>
    </div>`;
  }

  function draw() { view === "panel" ? renderPanel() : renderDash(); }

  /* ---------- Dialog und Toast ---------- */
  function dialog({ title, body, list, ok, danger }) {
    return new Promise((resolve) => {
      const before = document.activeElement;
      $("#dialog").className = "dialog";
      $("#dialog").innerHTML = `<h2 id="dlg-title">${esc(title)}</h2><div>${body}</div>${list ? `<ul>${list.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
        <div class="btn-row"><button class="btn" id="dlg-no">Abbrechen</button><button class="btn ${danger ? "dp" : "p"}" id="dlg-yes">${esc(ok)}</button></div>`;
      $("#backdrop").classList.add("open"); $("#dlg-no").focus();
      const done = (v) => { $("#backdrop").classList.remove("open"); document.removeEventListener("keydown", key); before?.focus?.(); resolve(v); };
      const key = (e) => { if (e.key === "Escape") done(false); if (e.key === "Tab") { e.preventDefault(); (document.activeElement === $("#dlg-no") ? $("#dlg-yes") : $("#dlg-no")).focus(); } };
      document.addEventListener("keydown", key);
      $("#dlg-no").onclick = () => done(false); $("#dlg-yes").onclick = () => done(true);
    });
  }
  let tt;
  function toast(msg, undo) {
    $("#toast").innerHTML = `<span>${esc(msg)}</span>${undo ? `<button id="undo">Rückgängig</button>` : ""}`;
    $("#toast").classList.add("show");
    if (undo) $("#undo").onclick = () => { undo(); $("#toast").classList.remove("show"); };
    clearTimeout(tt); tt = setTimeout(() => $("#toast").classList.remove("show"), 5000);
  }

  /* ---------- Passwort-Dialog ---------- */
  const CHARS = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function generate() {
    const a = new Uint32Array(16); crypto.getRandomValues(a);
    const s = [...a].map((v) => CHARS[v % CHARS.length]).join("");
    return s.match(/.{4}/g).join("-");
  }
  function check(p, q) {
    const ascii = /^[\x20-\x7e]*$/.test(p);
    return [
      ["len", "8 bis 63 Zeichen", p.length >= 8 && p.length <= 63],
      ["ascii", "nur Buchstaben, Ziffern und gängige Zeichen (keine Umlaute)", p.length ? ascii : null],
      ["space", "kein Leerzeichen am Anfang oder Ende", p.length ? p.trim() === p : null],
      ["same", "beide Eingaben gleich", q.length ? p === q : null],
    ];
  }
  function pwDialog() {
    const before = document.activeElement;
    let show = false;
    const d = $("#dialog");
    d.className = "dialog wide";
    d.innerHTML = `<h2 id="dlg-title">Passwort des Gastzugangs ändern</h2>
      <div class="muted" style="font-size:13px">Für <b style="color:var(--text)">${esc(guest.ssid)}</b>. Das Passwort wird nur an die Box geschickt und nirgends gespeichert oder protokolliert.</div>
      <div class="field"><label for="pw1">Neues Passwort</label><div class="pw"><input id="pw1" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="off" aria-describedby="pwrules"><button class="iconbtn" id="pwshow" aria-pressed="false" aria-controls="pw1 pw2" title="Passwort anzeigen" aria-label="Passwort anzeigen">${I.eye}</button></div></div>
      <div class="field"><label for="pw2">Wiederholen</label><div class="pw"><input id="pw2" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="off"></div></div>
      <div class="btn-row" style="margin-top:10px"><button class="btn sm" id="pwgen">${I.dice}Zufällig erzeugen</button></div>
      <ul class="rules" id="pwrules" aria-live="polite"></ul>
      <div class="warnbox">${I.alert}<span>${guest.clients} Gäste sind gerade verbunden. Sie werden getrennt und müssen sich mit dem neuen Passwort neu verbinden. Der alte QR-Code gilt dann nicht mehr.</span></div>
      <p class="msg" id="pwmsg" role="alert" style="color:var(--bad);font-size:13px;min-height:18px;margin:10px 0 0"></p>
      <div class="btn-row"><button class="btn" id="dlg-no">Abbrechen</button><button class="btn p" id="dlg-yes" disabled>Passwort setzen</button></div>`;
    $("#backdrop").classList.add("open");
    const p1 = $("#pw1"), p2 = $("#pw2"), yes = $("#dlg-yes");
    p1.focus();
    const upd = () => {
      const r = check(p1.value, p2.value);
      $("#pwrules").innerHTML = r.map(([, t, ok]) => `<li class="${ok === true ? "ok" : ok === false ? "bad" : ""}">${t}</li>`).join("");
      yes.disabled = !r.every(([, , ok]) => ok === true);
    };
    upd();
    const close = () => { p1.value = ""; p2.value = ""; $("#backdrop").classList.remove("open"); document.removeEventListener("keydown", key); before?.focus?.(); };
    const key = (e) => {
      if (e.key === "Escape") close();
      if (e.key === "Tab") {
        const stops = [...d.querySelectorAll("input, button:not([disabled])")];
        const at = stops.indexOf(document.activeElement); e.preventDefault();
        stops[(at + (e.shiftKey ? -1 : 1) + stops.length) % stops.length].focus();
      }
    };
    document.addEventListener("keydown", key);
    p1.oninput = upd; p2.oninput = upd;
    $("#pwshow").onclick = () => { show = !show; p1.type = p2.type = show ? "text" : "password"; $("#pwshow").setAttribute("aria-pressed", String(show)); $("#pwshow").innerHTML = show ? I.eyeOff : I.eye; };
    $("#pwgen").onclick = () => { const g = generate(); p1.value = g; p2.value = g; upd(); $("#pwmsg").textContent = ""; p1.focus(); };
    $("#dlg-no").onclick = close;
    yes.onclick = () => {
      yes.disabled = true; yes.textContent = "Wird gesetzt …";
      setTimeout(() => {
        close(); secret = null; reveal = false; guest.changed = "gerade eben (von hier)"; draw();
        toast("Das Passwort des Gastzugangs ist geändert. Der QR-Code ist neu.");
      }, 900);
    };
  }

  /* ---------- Ereignisse ---------- */
  async function switchNet(id) {
    const n = id === guest.id ? guest : nets.find((x) => x.id === id);
    const on = !n.enabled;
    if (!on && n !== guest) {
      const last = nets.filter((x) => x.enabled).length === 1;
      const ok = await dialog({
        title: `WLAN „${n.ssid}“ (${n.band}) ausschalten?`,
        body: `${n.clients} Geräte sind darüber verbunden. ${last ? "<b>Danach ist kein Funknetz der Box mehr an.</b> " : "Sie wechseln, wenn sie können, auf das andere Band. "}Wieder einschalten geht hier, per LAN oder mit der Taste WLAN an der Box.`,
        list: last ? ["Bist du gerade per WLAN mit Home Assistant verbunden, verlierst du die Verbindung zu diesem Panel.", "Die Repeater senden dann ebenfalls nicht mehr."] : null,
        ok: "Ausschalten", danger: true,
      });
      if (!ok) return;
    }
    busy.add(id); draw();
    setTimeout(() => {
      busy.delete(id); n.enabled = on; if (n === guest && !on) secret = null; draw();
      toast(`${n === guest ? "Gastzugang" : `WLAN ${n.band}`} ${on ? "eingeschaltet" : "ausgeschaltet"}.`, n === guest || on ? () => switchNet(id) : null);
    }, 1200);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.closest("#dialog")) return;
    if (b.dataset.mode) {
      document.documentElement.dataset.mode = b.dataset.mode === "auto" ? "" : b.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); return;
    }
    if (b.dataset.view) { view = b.dataset.view; document.querySelectorAll("[data-view]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); draw(); return; }
    if (b.dataset.net) return switchNet(b.dataset.net);
    const act = b.dataset.act;
    if (act === "qr") { qrBusy = true; draw(); setTimeout(() => { qrBusy = false; secret = "Sonnenblume-42-Garten"; draw(); }, 700); }
    if (act === "reveal") { reveal = !reveal; draw(); }
    if (act === "copy") toast("Passwort kopiert. Es bleibt in der Zwischenablage, bis du etwas anderes kopierst.");
    if (act === "hideqr") { secret = null; reveal = false; draw(); }
    if (act === "print") toast("Druckansicht: Name, Passwort und QR-Code auf einer Seite (im Mockup nicht gebaut).");
    if (act === "pw") pwDialog();
  });
  $("#st").addEventListener("change", (e) => { state = e.target.value; secret = null; reveal = false; busy.clear(); draw(); });
  draw();
</script>
</body>
</html>
