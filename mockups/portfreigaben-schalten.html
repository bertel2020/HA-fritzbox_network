<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfreigaben schalten – Mockup</title>
<style>
  /* ---------- Tokens wie panel-styles.js (Thema „Ozean“) ---------- */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f4f6f9, #0f1216);
    --surface: light-dark(#fff, #1b1f24);
    --soft: light-dark(#f5f7f9, #22272e);
    --line: light-dark(#e1e5ea, #2d333b);
    --input-line: light-dark(#c3cbd5, #3a424c);
    --text: light-dark(#1b1f24, #e6e9ed);
    --muted: light-dark(#5b6270, #9aa4b1);
    --accent: light-dark(#0a6aa8, #5bb2ea);
    --accent-hover: light-dark(#07507f, #8ccaf2);
    --accent-soft: light-dark(#eaf3fa, #16324a);
    --on-accent: light-dark(#fff, #0b1a26);
    --focus: #7db8e0;
    --up: light-dark(#7a4bc2, #b79af0);
    --ok: light-dark(#1e6b34, #7fd49a);
    --ok-soft: light-dark(#e6f4ea, #173a24);
    --warn: light-dark(#8a4b00, #f2c27a);
    --warn-soft: light-dark(#fff1de, #3a2a12);
    --bad: light-dark(#a1261b, #f2a29a);
    --bad-soft: light-dark(#fdecea, #3d1c19);
    --neutral-soft: light-dark(#eef1f4, #2a3038);
    --neutral-text: light-dark(#3a414c, #c5ccd5);
    --radius: 18px;
    --shadow-c: light-dark(rgb(16 24 40 / 14%), rgb(0 0 0 / 40%));
    --shadow: 0 1px 2px var(--shadow-c), 0 6px 18px -10px var(--shadow-c);
  }
  :root[data-mode="light"] { color-scheme: light; }
  :root[data-mode="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Roboto, "Noto Sans", system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .muted { color: var(--muted); }
  a, .linklike { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  /* Mockup-Leiste */
  .mockbar { max-width: 1200px; margin: 12px auto 0; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border-radius: 14px; background: var(--soft); border: 1px dashed var(--line); }
  .mockbar > span { flex: 1 1 260px; }
  .mockbar .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mockbar .ctl { min-width: 0; max-width: 100%; }
  .mockbar select { max-width: 100%; min-height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
  .subtabs { margin-bottom: 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
  .seg button { padding: 0 12px; min-height: 34px; font-weight: 500; color: var(--muted); border-left: 1px solid var(--line); white-space: nowrap; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
  .wrap { max-width: 1200px; margin: 12px auto 40px; padding: 0 12px; }
  .frame { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow); }

  /* Kopf des Panels */
  .header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 0 24px; padding: 0 20px; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 60px; min-width: 0; flex: 1 1 auto; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-hover); display: grid; place-items: center; flex: none; }
  .brand b { display: block; font-size: 18px; font-weight: 500; line-height: 1.2; white-space: nowrap; }
  .brand small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; max-width: 100%; }
  nav button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; font-weight: 500; color: var(--muted); white-space: nowrap; border-radius: 22px; }
  nav button:hover { color: var(--text); background: var(--neutral-soft); }
  nav button[aria-selected="true"] { color: var(--accent-hover); background: var(--accent-soft); }
  nav button.new::after { content: "neu"; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); }
  nav .dot { width: 7px; height: 7px; }
  main { padding: 16px 20px 32px; display: grid; gap: 16px; }
  @media (max-width: 600px) { .header { padding: 0 12px; } main { padding: 12px 12px 24px; } }

  /* Bausteine wie im Panel */
  .phead h1 { font-size: 24px; font-weight: 500; margin: 4px 0 2px; letter-spacing: -.01em; }
  .lead { color: var(--muted); margin: 0; max-width: 75ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .sec { padding: 16px; }
  .sec > .label { display: block; margin-bottom: 10px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 11px; border-radius: 13px; background: var(--neutral-soft); color: var(--neutral-text); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--accent-soft); color: var(--accent-hover); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--input-line); flex: none; display: inline-block; }
  .dot.on { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 20px; font-weight: 500; white-space: nowrap; border: 1px solid var(--input-line); background: var(--surface); }
  .btn:hover { background: var(--soft); }
  .btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.dp { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  .btn.sm { min-height: 34px; padding: 0 14px; font-size: 13px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .switch { position: relative; width: 52px; height: 32px; border-radius: 16px; background: #aeb6c1; flex: none; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / 30%); }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .switch[disabled] { opacity: .55; cursor: default; }
  .switch.busy::after { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  .tile { background: var(--soft); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile b { display: block; font-size: 18px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile small { display: block; font-size: 12px; color: var(--muted); }
  .tile.warn b { color: var(--warn); }
  .tile .na { color: var(--muted); font-weight: 400; font-size: 14px; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .hintline { display: flex; align-items: center; gap: 10px; margin: 4px 0; font-size: 14px; }
  .hintline.bad { color: var(--bad); } .hintline.warn { color: var(--warn); } .hintline.info { color: var(--muted); }
  .empty { display: grid; justify-items: center; gap: 6px; padding: 40px 16px; text-align: center; color: var(--muted); }
  .empty b { color: var(--text); font-weight: 500; }
  .ihead { display: flex; align-items: center; gap: 12px; }
  .ihead .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-hover); flex: none; }
  .ihead .who { flex: 1; min-width: 0; }
  .ihead .who b { display: block; font-size: 16px; font-weight: 500; }
  .ihead .who small { color: var(--muted); }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
  .skel { background: linear-gradient(90deg, var(--soft), var(--neutral-soft), var(--soft)); background-size: 200% 100%; animation: sk 1.4s infinite; border-radius: 8px; color: transparent !important; }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel, .switch.busy::after { animation: none; } }

  /* Dialog und Toast wie panel-dialogs.js */
  .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 45%); display: none; place-items: center; z-index: 20; padding: 16px; }
  .backdrop.open { display: grid; }
  .dialog { background: var(--surface); border-radius: 22px; padding: 22px; max-width: 460px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 40px -12px rgb(0 0 0 / 45%); }
  .dialog h2 { font-size: 18px; font-weight: 500; margin: 0 0 10px; }
  .dialog ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .dialog .btn-row { justify-content: flex-end; margin-top: 20px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120px); background: var(--text); color: var(--surface); padding: 12px 16px; border-radius: 12px; transition: transform .2s; z-index: 30; max-width: calc(100% - 32px); display: flex; gap: 14px; align-items: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast button { color: var(--accent-soft); font-weight: 600; text-decoration: underline; }

  /* Dashboard-Karte */
  .dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
  .hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
  .chead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .chead b { font-size: 16px; font-weight: 500; flex: 1; }
  .mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .notes { font-size: 13px; color: var(--muted); margin: 8px 2px 0; padding-left: 18px; }
  .notes li { margin: 3px 0; } .notes b { color: var(--text); font-weight: 500; }
  [hidden] { display: none !important; }
  /* Portfreigaben, wie panel-ports.js, dazu ein Schalter je Zeile */
  .chip.open { background: var(--warn-soft); color: var(--warn); }
  .chip.part { background: var(--accent-soft); color: var(--accent-hover); }
  .chip.proto { background: transparent; border: 1px solid var(--line); color: var(--text); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  .chip.dim { opacity: .55; }
  .pftiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 4px 0 14px; }
  .pftile { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
  .pftile b { display: block; font-size: 22px; font-weight: 500; }
  .pftile small { color: var(--muted); font-size: 12px; }
  .pftile.open b { color: var(--warn); }
  .pffilters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
  .fchip em { font-style: normal; color: var(--muted); }
  .fchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .pfdev { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .pfdev + .pfdev { margin-top: 12px; }
  .pfhead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--soft); flex-wrap: wrap; }
  .pfhead b { font-weight: 500; }
  .pfhead .sp { flex: 1; }
  .pfcols, .pfrule { display: grid; grid-template-columns: 104px minmax(0, 1fr) 64px minmax(170px, auto) 60px; gap: 4px 16px; align-items: center; padding: 10px 14px; }
  .pfcols { padding-top: 8px; padding-bottom: 6px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .pfcols .r, .pfports { text-align: right; }
  .pfrule + .pfrule, .fam { border-top: 1px solid var(--line); }
  .pfrule.closed .pfname, .pfrule.closed .pfports { opacity: .55; }
  .pfname { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
  .pfname b { font-weight: 500; }
  .pfports { white-space: nowrap; }
  .pfports .arrow { color: var(--muted); padding: 0 4px; }
  .pfports small { display: block; color: var(--muted); font-size: 11.5px; }
  .pfsw { justify-self: end; }
  .pfsw .lock { color: var(--muted); font-size: 12px; text-align: right; display: block; max-width: 90px; }
  .fam { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 8px 14px 8px 14px; background: color-mix(in srgb, var(--soft) 60%, transparent); font-size: 13px; }
  .switch[aria-checked="mixed"] { background: var(--warn); }
  .switch[aria-checked="mixed"]::after { transform: translateX(10px); }
  .more { font-size: 12px; }
  @media (max-width: 760px) {
    .pfcols { display: none; }
    .pfrule { grid-template-columns: minmax(0, 1fr) auto; }
    .pfrule > :nth-child(1) { grid-column: 1; }
    .pfrule .pfsw { grid-column: 2; grid-row: 1; }
    .pfrule .pfname, .pfrule .pfproto, .pfrule .pfports { grid-column: 1 / -1; text-align: left; }
    .fam { grid-template-columns: minmax(0, 1fr) auto; }
    .fam > :first-child { display: none; }
  }
  .pfnote { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13px; background: var(--soft); color: var(--muted); margin: 14px 0 0; }
  .pfnote.warn { background: var(--warn-soft); color: var(--warn); }
  .sw-busy { font-size: 12px; color: var(--accent); }
</style>
</head>
<body>
<div class="mockbar">
  <span class="muted">Mockup: die Karte <b>Portfreigaben</b> der Internet-Seite (panel-ports.js) mit einem Schalter je Freigabe. Öffnen fragt nach, Schließen nicht (mit Rückgängig). Daten wie in <span class="mono">mockups/portfreigaben.html</span>.</span>
  <div class="ctl">
    <label class="sr" for="st">Zustand</label>
    <select id="st">
      <option value="ok">Normal</option>
      <option value="loading">Lädt</option>
      <option value="error">Fehler beim Lesen</option>
      <option value="ro">Nur lesen (kein Recht)</option>
      <option value="noweb">Web-Oberfläche nicht lesbar (nur UPnP)</option>
      <option value="none">Keine Freigaben</option>
      <option value="fail">Schalten scheitert</option>
    </select>
    <span class="seg" role="group" aria-label="Farbschema">
      <button data-mode="auto" aria-pressed="true">System</button>
      <button data-mode="light" aria-pressed="false">Hell</button>
      <button data-mode="dark" aria-pressed="false">Dunkel</button>
    </span>
  </div>
</div>

<div class="wrap">
  <div class="frame">
    <header class="header">
      <div class="brand">
        <div class="logo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 17h.01M12 14V9M9 9a4.2 4.2 0 0 1 6 0"/></svg></div>
        <div><b>FRITZ!Box Netzwerk</b><small>FRITZ-RM · FRITZ!Box 7590 AX</small></div>
      </div>
      <nav role="tablist" aria-label="Seiten" id="nav"></nav>
    </header>
    <main id="main"></main>
  </div>
</div>

<div class="backdrop" id="backdrop"><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ALERT = '<svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>';

  // one rule as ports/list gives it; key = what ports/switch takes to find it again
  let n = 0;
  const R = (device, ip, online, app, protocol, ext, extEnd, int, intEnd, family, enabled, source = "manual", lease = 0) =>
    ({ key: `r${n++}`, device, ip, online, app, protocol, ext, extEnd, int, intEnd, family, enabled, source, lease });
  const FULL = [
    R("NAS", "192.168.178.40", true, "OpenVPN", "UDP", 1194, null, 1194, null, "ipv4", false),
    R("NAS", "192.168.178.40", true, "WireGuard", "UDP", 51820, null, 51820, null, "ipv4", false),
    R("Home Assistant", "192.168.178.10", true, "HTTPS", "TCP", 443, null, 8123, null, "ipv4", true),
    R("Home Assistant", "192.168.178.10", true, "HTTPS", "TCP", 443, null, 8123, null, "ipv6", false),
    R("tracker", "192.168.178.41", true, "Tracker_5027", "UDP", 5027, null, 5027, null, "ipv4", true),
    R("tracker", "192.168.178.41", true, "Tracker_5027", "UDP", 5027, null, 5027, null, "ipv6", true),
    R("Spielkonsole", "192.168.178.60", true, "", "UDP", 3074, null, 3074, null, "ipv4", true, "upnp", 600),
  ];
  let rules = structuredClone(FULL);
  let state = "ok", filter = "all", openFam = new Set(), busy = new Set();

  function nav() {
    const tabs = [["net", "Netzwerk"], ["internet", "Internet", '<i class="dot on" aria-hidden="true"></i>'], ["box", "Box"], ["diagnose", "Diagnose"], ["devices", "Verwalten"]];
    $("#nav").innerHTML = tabs.map(([id, name, extra = ""]) => `<button role="tab" aria-selected="${id === "internet"}">${name}${extra}</button>`).join("");
  }
  const subtabs = (label, items, active) => `<div class="seg subtabs" role="tablist" aria-label="${label}">${items.map((n) => `<button role="tab" aria-selected="${n === active}">${n}</button>`).join("")}</div>`;
  const portText = (a, b) => (b ? `${a}–${b}` : String(a));

  function merge(list) {
    const rows = [];
    for (const r of list) {
      const id = [r.device, r.app, r.protocol, r.ext, r.extEnd, r.int, r.intEnd, r.source].join("|");
      const hit = rows.find((x) => x.id === id);
      if (hit) hit.fams.push(r); else rows.push({ ...r, id, fams: [r] });
    }
    for (const row of rows) {
      const on = row.fams.filter((f) => f.enabled).length;
      row.state = on === 0 ? "closed" : on === row.fams.length ? "open" : "part";
      row.isV6 = row.fams.some((f) => f.family === "ipv6");
    }
    return rows;
  }
  const passes = (r) => filter === "all" || (filter === "open" && r.state !== "closed") || (filter === "closed" && r.state === "closed") || (filter === "ipv6" && r.isV6) || (filter === "upnp" && r.source === "upnp");

  function swFor(row) {
    const ro = state === "ro" || state === "noweb";
    if (row.source === "upnp") return `<span class="lock" title="Ein Gerät hat den Port selbst per UPnP geöffnet.">vom Gerät geöffnet</span>`;
    const b = row.fams.some((f) => busy.has(f.key));
    const checked = row.state === "open" ? "true" : row.state === "part" ? "mixed" : "false";
    return `<button class="switch ${b ? "busy" : ""}" role="switch" aria-checked="${checked}" aria-label="${esc(row.app || "Freigabe")} ${row.protocol} ${portText(row.ext, row.extEnd)} zu ${esc(row.device)}" data-row="${esc(row.id)}"${ro || b ? " disabled" : ""}></button>`;
  }

  function ruleRow(r) {
    const st = { open: `<span class="chip open"><i class="dot warn"></i>offen</span>`, closed: `<span class="chip"><i class="dot"></i>zu</span>`, part: `<span class="chip part"><i class="dot warn"></i>teils offen</span>` }[r.state];
    const fam = r.fams.map((f) => `<span class="chip info ${f.enabled ? "" : "dim"}">${f.family === "ipv6" ? "IPv6" : "IPv4"}</span>`).join("");
    const same = r.ext === r.int && r.extEnd === r.intEnd;
    const ports = same ? `<span class="mono">${portText(r.ext, r.extEnd)}</span><small>von außen und am Gerät</small>` : `<span class="mono">${portText(r.ext, r.extEnd)}</span><span class="arrow">→</span><span class="mono">${portText(r.int, r.intEnd)}</span><small>außen → am Gerät</small>`;
    const name = r.app ? `<b>${esc(r.app)}</b>` : `<b class="muted">Ohne Namen</b>`;
    const upnp = r.source === "upnp" ? `<span class="chip">UPnP · endet in 10 min</span>` : "";
    const two = r.fams.length > 1 && r.source !== "upnp";
    const toggle = two ? `<button class="linklike more" data-fam="${esc(r.id)}" aria-expanded="${openFam.has(r.id)}">IPv4 und IPv6 einzeln</button>` : "";
    const busyNote = r.fams.some((f) => busy.has(f.key)) ? `<span class="sw-busy">Box übernimmt …</span>` : "";
    let html = `<div class="pfrule ${r.state === "closed" ? "closed" : ""}">
      <div>${st}</div><div class="pfname">${name}${fam}${upnp}${toggle}${busyNote}</div>
      <div class="pfproto"><span class="chip proto">${r.protocol}</span></div><div class="pfports">${ports}</div><div class="pfsw">${swFor(r)}</div></div>`;
    if (two && openFam.has(r.id)) {
      const ro = state === "ro";
      html += r.fams.map((f) => `<div class="fam"><span></span><span>${f.family === "ipv6" ? "IPv6 (Pinhole in der Firewall)" : "IPv4 (Weiterleitung)"} · ${f.enabled ? "offen" : "zu"}</span>
        <button class="switch" role="switch" aria-checked="${f.enabled}" aria-label="${esc(r.app)} ${f.family === "ipv6" ? "IPv6" : "IPv4"}" data-one="${f.key}"${ro || busy.has(f.key) ? " disabled" : ""}></button></div>`).join("");
    }
    return html;
  }

  function card() {
    const head = `<span class="label">Portfreigaben</span>`;
    if (state === "loading") return `<section class="card sec" aria-busy="true">${head}<div class="pftiles">${[1, 2, 3].map(() => `<div class="pftile"><b class="skel">0</b><small class="skel">lädt</small></div>`).join("")}</div><p class="hint">Wird geladen …</p></section>`;
    if (state === "error") return `<section class="card sec">${head}<p class="hintline bad">${ALERT}<span>Die Box hat die Portfreigaben nicht genannt. <a>Erneut versuchen</a></span></p></section>`;
    const list = state === "none" ? [] : state === "noweb" ? rules.filter((r) => r.source === "upnp") : rules;
    const rows = merge(list);
    if (!rows.length) return `<section class="card sec">${head}<div class="empty"><b>Es sind keine Ports zum Internet offen.</b><span>Freigaben anlegen geht in der Box unter Internet › Freigaben.</span></div></section>`;
    const open = rows.filter((r) => r.state !== "closed").length;
    const devs = new Set(rows.map((r) => r.device)).size;
    const counts = { all: rows.length, open, closed: rows.length - open, ipv6: rows.filter((r) => r.isV6).length, upnp: rows.filter((r) => r.source === "upnp").length };
    const label = { all: "Alle", open: "Offen", closed: "Zu", ipv6: "IPv6", upnp: "UPnP" };
    const shown = rows.filter(passes);
    const groups = [...new Set(shown.map((r) => r.device))].map((d) => {
      const g = shown.filter((r) => r.device === d), f = g[0];
      return `<div class="pfdev"><div class="pfhead"><b><span class="linklike">${esc(d)}</span></b><span class="mono muted">${f.ip}</span><span class="sp"></span><span class="chip"><i class="dot ${f.online ? "on" : ""}"></i>${f.online ? "online" : "offline"}</span></div>
        <div class="pfcols" aria-hidden="true"><span>Status</span><span>Freigabe</span><span>Protokoll</span><span class="r">Port</span><span class="r">An</span></div>${g.map(ruleRow).join("")}</div>`;
    }).join("");
    const note = state === "ro" ? `<p class="pfnote">${ALERT}<span>Nur zur Ansicht: Schalten braucht das Recht „FRITZ!Box Einstellungen“.</span></p>`
      : state === "noweb" ? `<p class="pfnote warn">${ALERT}<span>Die Box hat die von Hand gesetzten Freigaben nicht genannt, nur die per UPnP geöffneten. Die lassen sich hier nicht schalten: Das Gerät schließt sie selbst.</span></p>` : "";
    return `<section class="card sec pfcard">${head}
      <div class="pftiles"><div class="pftile ${open ? "open" : ""}"><b>${open}</b><small>offen aus dem Internet</small></div><div class="pftile"><b>${rows.length - open}</b><small>zu</small></div><div class="pftile"><b>${devs}</b><small>Geräte</small></div></div>
      ${note}
      <div class="pffilters" role="group" aria-label="Filter">${Object.keys(label).map((k) => `<button class="fchip" data-f="${k}" aria-pressed="${filter === k}">${label[k]}<em>${counts[k]}</em></button>`).join("")}</div>
      ${groups || `<div class="empty"><b>Keine Freigabe passt zum Filter.</b></div>`}
      <p class="pfnote"><span>ⓘ</span><span>Eine offene Freigabe lässt Verkehr aus dem Internet direkt an das Gerät. Hier lassen sich die von Hand gesetzten ein- und ausschalten; anlegen, ändern und löschen geht in der Box. Per UPnP geöffnete schließt das Gerät selbst.</span></p></section>`;
  }

  function draw() {
    nav();
    $("#main").innerHTML = `${subtabs("Internet", ["Verbindung", "VPN"], "Verbindung")}<div class="phead"><h1>Internet</h1><p class="lead">… Verbindung, Last, Datenvolumen, Leitung wie bisher …</p></div>${card()}`;
  }

  /* ---------- Dialog und Toast ---------- */
  function dialog({ title, body, list, ok, danger }) {
    return new Promise((resolve) => {
      const before = document.activeElement;
      $("#dialog").innerHTML = `<h2 id="dlg-title">${esc(title)}</h2><div>${body}</div>${list ? `<ul>${list.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
        <div class="btn-row"><button class="btn" id="dlg-no">Abbrechen</button><button class="btn ${danger ? "dp" : "p"}" id="dlg-yes">${esc(ok)}</button></div>`;
      $("#backdrop").classList.add("open"); $("#dlg-no").focus();
      const done = (v) => { $("#backdrop").classList.remove("open"); document.removeEventListener("keydown", key); before?.focus?.(); resolve(v); };
      const key = (e) => { if (e.key === "Escape") done(false); if (e.key === "Tab") { e.preventDefault(); (document.activeElement === $("#dlg-no") ? $("#dlg-yes") : $("#dlg-no")).focus(); } };
      document.addEventListener("keydown", key);
      $("#dlg-no").onclick = () => done(false); $("#dlg-yes").onclick = () => done(true);
    });
  }
  let tt;
  function toast(msg, undo) {
    $("#toast").innerHTML = `<span>${esc(msg)}</span>${undo ? `<button id="undo">Rückgängig</button>` : ""}`;
    $("#toast").classList.add("show");
    if (undo) $("#undo").onclick = () => { undo(); $("#toast").classList.remove("show"); };
    clearTimeout(tt); tt = setTimeout(() => $("#toast").classList.remove("show"), 6000);
  }

  /** Switches the given families on or off; opening asks first, closing offers undo. */
  async function apply(fams, on, title) {
    const r = fams[0];
    if (on) {
      const ok = await dialog({
        title: `${r.protocol} ${portText(r.ext, r.extEnd)} zu ${r.device} öffnen?`,
        body: `Danach erreicht <b>jeder im Internet</b> ${esc(r.device)} (${r.ip}) an Port ${portText(r.int, r.intEnd)}${fams.some((f) => f.family === "ipv6") ? ", über IPv6 direkt am Gerät" : ""}. Öffne nur, was du kennst und was ein aktuelles Passwort hat.`,
        list: r.online ? null : [`${r.device} ist gerade offline; die Freigabe greift, sobald es wieder da ist.`],
        ok: "Öffnen", danger: true,
      });
      if (!ok) return;
    }
    fams.forEach((f) => busy.add(f.key)); draw();
    setTimeout(() => {
      fams.forEach((f) => busy.delete(f.key));
      if (state === "fail") { draw(); toast(`Die Box hat die Freigabe nicht geändert: „Internal Error 501“. Sie ist weiter ${r.enabled ? "offen" : "zu"}.`); return; }
      fams.forEach((f) => (f.enabled = on)); draw();
      toast(`${title} ${on ? "geöffnet" : "geschlossen"}.`, on ? null : () => apply(fams, true, title));
    }, 900);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.closest("#dialog")) return;
    if (b.dataset.mode) {
      document.documentElement.dataset.mode = b.dataset.mode === "auto" ? "" : b.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); return;
    }
    if (b.dataset.f) { filter = b.dataset.f; draw(); return; }
    if (b.dataset.fam) { openFam.has(b.dataset.fam) ? openFam.delete(b.dataset.fam) : openFam.add(b.dataset.fam); draw(); return; }
    if (b.dataset.row) {
      const row = merge(rules).find((r) => r.id === b.dataset.row);
      const fams = row.fams.map((f) => rules.find((x) => x.key === f.key));
      // "part" and "closed" open all families, "open" closes all
      return apply(fams, row.state !== "open", `${row.app || "Freigabe"} (${row.protocol} ${portText(row.ext, row.extEnd)})`);
    }
    if (b.dataset.one) {
      const f = rules.find((x) => x.key === b.dataset.one);
      return apply([f], !f.enabled, `${f.app} ${f.family === "ipv6" ? "IPv6" : "IPv4"}`);
    }
  });
  $("#st").addEventListener("change", (e) => { state = e.target.value; rules = structuredClone(FULL); busy.clear(); filter = "all"; draw(); });
  draw();
</script>
</body>
</html>
