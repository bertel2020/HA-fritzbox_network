<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel v2 Mockup</title>
<meta name="description" content="Seitenpanel FRITZ!Box Netzwerk v2: Liste und Netzkarte (zwei Varianten), Filter mit Mehr-Menü, Gerät als Vollseite.">
<style>
  /* Dieselben Tokens wie PANEL_CSS (panel-styles.js), hier auf :root statt :host. */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f4f6f9, #0f1216);
    --surface: light-dark(#fff, #1b1f24);
    --soft: light-dark(#f5f7f9, #22272e);
    --line: light-dark(#e1e5ea, #2d333b);
    --line-2: light-dark(#eef0f3, #262c33);
    --input-line: light-dark(#c3cbd5, #3a424c);
    --text: light-dark(#1b1f24, #e6e9ed);
    --muted: light-dark(#5b6270, #9aa4b1);
    --accent: light-dark(#0a6aa8, #5bb2ea);
    --accent-hover: light-dark(#07507f, #8ccaf2);
    --accent-soft: light-dark(#eaf3fa, #16324a);
    --on-accent: light-dark(#fff, #0b1a26);
    --focus: #7db8e0;
    --ok: light-dark(#1e6b34, #7fd49a);
    --ok-soft: light-dark(#e6f4ea, #173a24);
    --warn: light-dark(#8a4b00, #f2c27a);
    --warn-soft: light-dark(#fff1de, #3a2a12);
    --bad: light-dark(#a1261b, #f2a29a);
    --bad-soft: light-dark(#fdecea, #3d1c19);
    --neutral-soft: light-dark(#eef1f4, #2a3038);
    --radius: 18px;
    --shadow-c: light-dark(rgb(16 24 40 / 14%), rgb(0 0 0 / 40%));
    --shadow: 0 1px 2px var(--shadow-c), 0 6px 18px -10px var(--shadow-c);
    /* neu für die Netzkarte */
    --link: light-dark(#8e98a6, #6b7684);
    --page: light-dark(#dfe4ea, #07090b);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 Roboto, "Noto Sans", system-ui, sans-serif; display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  /* ---------- Mockup-Steuerung (gehört nicht zum Panel) ---------- */
  .mk { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
  .mk h1 { font-size: 14px; font-weight: 600; margin: 0 8px 0 0; }
  .mk .grp { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .mk .grp > span { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .mk .seg button { min-height: 32px; padding: 0 10px; font-size: 13px; }
  .mk-desc { flex: none; padding: 6px 16px 8px; font-size: 12.5px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
  .mk-desc b { color: var(--text); font-weight: 500; }
  .stage { flex: 1; min-height: 420px; display: flex; justify-content: center; align-items: stretch; overflow: hidden; }
  .stage.phone { padding: 12px; align-items: center; }
  /* Der Rahmen ist der "Bildschirm": eigener Scroll, fixed-Elemente beziehen sich auf ihn. */
  .frame { container: app / inline-size; position: relative; transform: translateZ(0); overflow: hidden; background: var(--bg); width: 100%; height: 100%; }
  .stage.phone .frame { width: min(406px, 100%); height: min(860px, 100%); border-radius: 28px; border: 8px solid light-dark(#1b1f24, #3a424c); box-shadow: 0 10px 40px rgb(0 0 0 / 25%); }
  .viewport { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; }

  /* ---------- Kopf (wie heute) ---------- */
  .app { min-height: 100%; }
  .header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 0 24px; padding: 0 max(16px, calc((100% - 1200px) / 2 + 24px)); }
  .brand { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 60px; min-width: 0; }
  .menu { display: none; width: 40px; height: 40px; margin-left: -10px; place-items: center; border-radius: 50%; }
  .logo { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-hover); border: 1px solid var(--line); flex: none; }
  .brand b { display: block; font-size: 18px; font-weight: 500; line-height: 1.2; white-space: nowrap; }
  .brand small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 4px; padding: 8px 0; }
  nav button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 20px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  nav button:hover { color: var(--text); background: var(--neutral-soft); }
  nav button[aria-selected="true"] { color: var(--accent-hover); background: var(--accent-soft); }
  nav em { font-style: normal; font-size: 11px; font-weight: 600; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: inline-grid; place-items: center; background: var(--warn-soft); color: var(--warn); }
  @container app (max-width: 900px) { .header { gap: 0; } nav { order: 3; width: 100%; padding-top: 0; } nav button { flex: 1; justify-content: center; padding: 0 8px; } }
  @container app (max-width: 760px) { .menu { display: grid; } }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 64px; }
  @container app (max-width: 600px) { main { padding: 16px 16px 56px; } }

  /* ---------- gemeinsame Teile (wie PANEL_CSS) ---------- */
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 11px; border-radius: 13px; background: var(--neutral-soft); color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--accent-soft); color: var(--accent-hover); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--input-line); flex: none; }
  .dot.on { background: var(--ok); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  h2 { font-size: 16px; font-weight: 500; margin: 0; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .muted { color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 20px; font-weight: 500; white-space: nowrap; border: 1px solid var(--input-line); background: var(--surface); }
  .btn:hover { background: var(--soft); }
  .btn.sm { min-height: 34px; padding: 0 14px; font-size: 13px; }
  .btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.d { color: var(--bad); border-color: transparent; background: none; }
  .btn.d:hover { background: var(--bad-soft); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--neutral-soft); color: var(--text); }
  .icon-btn[disabled] { opacity: .4; cursor: default; }
  .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; width: 20px; flex: none; }
  .bars i { width: 3px; background: var(--line); border-radius: 1px; }
  .bars i.on { background: var(--ok); }
  .bars.mid i.on { background: var(--warn); }
  .bars.low i.on { background: var(--bad); }
  .seg { display: inline-flex; border: 1px solid var(--input-line); border-radius: 10px; overflow: hidden; max-width: 100%; flex: none; }
  .seg button { padding: 0 12px; min-height: 40px; font-weight: 500; color: var(--muted); border-left: 1px solid var(--input-line); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  input[type="search"], select { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--input-line); background: var(--surface); padding: 0 12px; min-width: 0; }
  input[type="search"] { padding-left: 38px; }

  /* ---------- Werkzeugleiste ---------- */
  .toolbar { padding: 16px; display: grid; gap: 12px; position: relative; }
  .tools { display: grid; grid-template-columns: minmax(0, 1fr) 160px 170px auto; gap: 8px; align-items: center; }
  .tools.map { grid-template-columns: minmax(0, 1fr) auto; }
  @container app (max-width: 700px) {
    .tools { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .tools .search, .tools .viewsw { grid-column: 1 / -1; }
    .tools.map { grid-template-columns: minmax(0, 1fr); }
  }
  .search { position: relative; display: block; }
  .search svg { position: absolute; left: 12px; top: 12px; color: var(--muted); }
  .search kbd { position: absolute; right: 10px; top: 10px; font: 12px monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  @container app (max-width: 700px) { .search kbd { display: none; } }
  .sel { position: relative; display: block; min-width: 0; }
  .sel > span { position: absolute; left: 12px; top: 4px; font-size: 10px; line-height: 1.2; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); pointer-events: none; }
  .sel select { padding-top: 13px; font-size: 13px; }
  .viewsw { display: flex; }
  .viewsw button { flex: 1; justify-content: center; }
  .meta { color: var(--muted); font-size: 12px; padding: 0 4px; }

  /* Filter: drei feste Chips + aktiver Zusatzfilter + "Mehr"-Menü. Bricht um, scrollt nie waagerecht. */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .fchip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; white-space: nowrap; background: var(--surface); }
  .fchip b { font-weight: 600; font-size: 12px; }
  .fchip svg.i { width: 14px; height: 14px; }
  .fchip:hover { color: var(--text); background: var(--soft); }
  .fchip[aria-pressed="true"] { color: var(--accent-hover); border-color: var(--accent); background: var(--accent-soft); }
  .fchip.more[aria-expanded="true"] { border-color: var(--accent); }
  .fchip .x { margin-right: -4px; display: inline-grid; }
  @container app (max-width: 600px) { .chips { gap: 6px; } .fchip { padding: 0 9px; } .fchip.more > svg.i:first-child, .fchip.more b { display: none; } .maphead .aslist { display: none; } }
  .fmenu { position: absolute; z-index: 12; top: 100%; left: 16px; margin-top: -8px; width: 300px; max-height: 420px; overflow: auto; padding: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px var(--shadow-c); }
  .fmenu .label { display: block; padding: 8px 10px 4px; }
  .fmenu [role="menuitemradio"] { display: flex; width: 100%; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; text-align: left; }
  .fmenu [role="menuitemradio"]:hover, .fmenu [role="menuitemradio"]:focus-visible { background: var(--soft); }
  .fmenu [role="menuitemradio"] .t { flex: 1; }
  .fmenu [role="menuitemradio"] b { font-size: 12px; color: var(--muted); font-weight: 600; }
  .fmenu [aria-checked="true"] { color: var(--accent-hover); background: var(--accent-soft); }
  .fmenu .ck { width: 18px; display: inline-grid; }
  .sheet-scrim { position: fixed; inset: 0; z-index: 11; background: rgb(0 0 0 / 35%); }
  @container app (min-width: 601px) { .sheet-scrim { background: transparent; } }
  @container app (max-width: 600px) {
    .fmenu { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; margin: 0; max-height: 75%; border-radius: 20px 20px 0 0; padding: 8px 12px 20px; }
    .fmenu::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--input-line); margin: 4px auto 8px; }
    .fmenu [role="menuitemradio"] { min-height: 48px; }
  }

  /* ---------- Liste (wie heute, Funkbänder brechen um statt zu scrollen) ---------- */
  .ap { margin-top: 16px; overflow: hidden; }
  .ap-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; text-align: left; min-width: 0; }
  .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-hover); flex: none; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ap-head .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .ap-head .chev { color: var(--muted); transition: transform .15s; display: inline-grid; }
  .ap.closed .chev { transform: rotate(-90deg); }
  .ap.closed .ap-body { display: none; }
  .radios { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
  .radio { flex: 1 1 150px; max-width: 260px; background: var(--soft); border-radius: 12px; padding: 8px 12px; }
  .radio .top { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
  .radio .top b { font-weight: 500; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; background: var(--ok); }
  .meter i.busy { background: var(--warn); }
  .busyText { color: var(--warn); }
  .groupbar { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; }
  .dev { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; border-top: 1px solid var(--line); text-align: left; min-width: 0; min-height: 56px; }
  .dev:hover { background: color-mix(in srgb, var(--soft) 60%, transparent); }
  .dev .end { display: flex; align-items: center; gap: 10px; flex: none; color: var(--muted); font-size: 12px; }
  .dev .link { color: var(--muted); display: inline-grid; }
  .dev.off .who b { color: var(--muted); }
  .warnIcon { color: var(--warn); display: inline-flex; }
  @container app (max-width: 480px) { .dev .rate, .dev .link { display: none; } }
  .empty { display: grid; justify-items: center; gap: 6px; padding: 48px 16px; text-align: center; color: var(--muted); }
  .empty b { color: var(--text); font-weight: 500; }

  /* ---------- Netzkarte, gemeinsam ---------- */
  .mapcard { margin-top: 16px; padding: 16px; position: relative; }
  .maphead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
  .maphead h2 { flex: 1 1 auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lg-line { width: 26px; height: 0; border-top: 2px solid var(--link); display: inline-block; }
  .lg-line.wlan { border-top-style: dashed; }
  .lg-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid var(--ok); background: var(--ok-soft); }
  .lg-dot.off { border: 2px dashed var(--input-line); background: var(--surface); }
  .lg-dot.blk { border-color: var(--bad); background: var(--bad-soft); }
  .lg-dot.weak { border-color: var(--warn); background: var(--warn-soft); }
  .lg-dot.sq { border-radius: 4px; }

  /* Variante 1: Inseln. Pro Access Point eine Fläche, Geräte als Knöpfe an "Leitungen". Ohne Pinch lesbar. */
  .isl { position: relative; }
  .isl svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .isl svg.links path { fill: none; stroke: var(--link); stroke-width: 2; }
  .isl svg.links path.wlan { stroke-dasharray: 6 5; }
  .inet { display: flex; justify-content: center; margin-bottom: 22px; }
  .inet span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 14px; background: var(--ok-soft); color: var(--ok); font-size: 12px; font-weight: 500; }
  .isles { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px 16px; position: relative; }
  .isle { position: relative; border: 1px solid var(--line); border-radius: 16px; background: var(--soft); padding: 12px; min-width: 0; }
  .isle.root { grid-column: 1 / -1; background: color-mix(in srgb, var(--accent-soft) 45%, var(--soft)); }
  .isle.root .buses { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 16px; }
  .isle.lost { border-style: dashed; }
  .isle-h { display: flex; align-items: center; gap: 10px; min-width: 0; margin-bottom: 10px; }
  .isle-h .ico { width: 34px; height: 34px; }
  .isle-up { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
  .loads { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 10px; }
  .load { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .load.busy { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .bus { border-left: 2px solid var(--link); padding: 0 0 4px 10px; margin: 0 0 10px 6px; min-width: 0; }
  .bus.wlan { border-left-style: dashed; }
  .bus-h { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  .nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px 4px; }
  .isl.compact .nodes { grid-template-columns: repeat(auto-fill, 44px); gap: 4px; }
  .nd { display: grid; justify-items: center; gap: 3px; padding: 4px 2px; border-radius: 10px; min-width: 0; text-align: center; }
  .nd:hover { background: var(--surface); }
  .nd .c { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600;
    border: 2px solid var(--ok); background: var(--ok-soft); color: var(--ok); }
  .nd.lan .c { border-radius: 9px; }
  .nd.off .c { border: 2px dashed var(--input-line); background: var(--surface); color: var(--muted); }
  .nd.weak .c { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
  .nd.blk .c { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .nd .bd { position: absolute; top: -5px; right: -6px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 2px solid var(--soft); }
  .nd.weak .bd { background: var(--warn); color: var(--surface); }
  .nd.blk .bd { background: var(--bad); color: var(--surface); }
  .nd .sg { position: absolute; bottom: -4px; right: -6px; display: inline-flex; gap: 1px; align-items: flex-end; height: 10px; padding: 1px 2px; border-radius: 3px; background: var(--surface); }
  .nd .sg i { width: 2px; background: var(--line); }
  .nd .sg i.on { background: var(--ok); }
  .nd .sg.mid i.on { background: var(--warn); }
  .nd .sg.low i.on { background: var(--bad); }
  .nd .nm { font-size: 11px; line-height: 1.25; color: var(--text); max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; hyphens: auto; }
  .nd.off .nm { color: var(--muted); }
  .isl.compact .nd .nm { display: none; }
  .nd.hl .c { box-shadow: 0 0 0 4px var(--focus); }
  .hidden-note { font-size: 12px; color: var(--muted); margin: 0 0 8px 18px; }
  @container app (max-width: 600px) {
    .mapcard { padding: 12px; }
    .toolbar { padding: 12px; }
    .isles { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .isle:not(.root) { margin-left: 26px; }
    .isle { padding: 10px; }
    .nodes { grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); }
    .inet { justify-content: flex-start; margin-bottom: 14px; }
  }

  /* Variante 2: Radial. Freie Karte mit Zoomen und Verschieben (Maus, Rad, Pinch, Knöpfe). */
  .rad { position: relative; height: 600px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; }
  @container app (max-width: 600px) { .rad { height: 480px; } }
  .rad svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
  .rad svg.drag { cursor: grabbing; }
  .rad .ln { fill: none; stroke: var(--link); stroke-width: 1.5; }
  .rad .ln.wlan { stroke-dasharray: 5 4; }
  .rad .ln.weak { stroke: var(--warn); }
  .rad .ln.up { stroke-width: 3; }
  .rad .hub circle { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
  .rad .hub.lost circle { fill: var(--surface); stroke: var(--input-line); stroke-dasharray: 4 3; }

/** Die Linien zwischen Box und Repeatern, nach dem Layout gemessen (geht in jeder Spaltenzahl). */
function drawLinks() {
  const wrap = document.getElementById("isl"); const svg = document.getElementById("links");
  if (!wrap || !svg) return;
  const W = wrap.getBoundingClientRect();
  const root = wrap.querySelector(".isle.root").getBoundingClientRect();
  const inet = wrap.querySelector(".inet span").getBoundingClientRect();
  const phone = frame.clientWidth <= 600;
  const p = [];
  const x0 = phone ? inet.left - W.left + 14 : inet.left - W.left + inet.width / 2;
  p.push(`<path d="M${x0},${inet.bottom - W.top} V${root.top - W.top}"/>`);
  wrap.querySelectorAll(".isle[data-up]:not(.root)").forEach((el, i) => {
    const type = el.dataset.up; if (!type) return;
    const r = el.getBoundingClientRect();
    if (phone) {
      const x = 8 + i * 8, y = r.top - W.top + 28;
      p.push(`<path class="${type}" d="M${x},${root.bottom - W.top} V${y} H${r.left - W.left}"/>`);
    } else {
      const x = r.left - W.left + r.width / 2, y0 = root.bottom - W.top, y1 = r.top - W.top;
      p.push(`<path class="${type}" d="M${x},${y0} V${y1}"/>`);
    }
  });
  svg.innerHTML = p.join("");
}

/* Radial: Positionen werden aus der Topologie gerechnet, nicht gespeichert. */
function radialLayout() {
  const hubs = NODES.map((node) => ({ node, list: CLIENTS.filter((c) => c.ap === node.mac).sort((a, b) => (a.link_type === "lan") - (b.link_type === "lan") || a.name.localeCompare(b.name)) }));
  const lost = CLIENTS.filter((c) => !c.ap);
  const ringR = (k) => { let r = 70, cap, left = k, rings = 0; while (left > 0) { cap = Math.floor((2 * Math.PI * r) / 30); left -= cap; rings++; if (left > 0) r += 30; } return { r, rings }; };
  const place = (hx, hy, list, start = 0, span = 2 * Math.PI) => {
    const out = []; let r = 70, i = 0;
    while (i < list.length) {
      const cap = Math.max(1, Math.floor((span * r) / 30)); const take = Math.min(cap, list.length - i);
      for (let j = 0; j < take; j++) { const a = start + (span * (j + 0.5)) / take; out.push({ c: list[i + j], x: hx + r * Math.cos(a), y: hy + r * Math.sin(a) }); }
      i += take; r += 30;
    }
    return out;
  };
  const master = hubs[0], reps = hubs.slice(1);
  const mr = ringR(master.list.length).r, rr = Math.max(...reps.map((h) => ringR(h.list.length).r), 70);
  const R = mr + rr + 70;
  const pos = [{ hub: master.node, x: 0, y: 0 }];
  const dots = place(0, 0, master.list).map((d) => ({ ...d, hub: master.node }));
  const tall = frame.clientWidth <= 600; // schmal: Repeater oben/unten statt links/rechts
  reps.forEach((h, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / reps.length + (tall ? 0 : Math.PI / reps.length);
    const x = R * Math.cos(a), y = R * Math.sin(a);
    pos.push({ hub: h.node, x, y });
    dots.push(...place(x, y, h.list).map((d) => ({ ...d, hub: h.node })));
  });
  if (lost.length) {
    const lx = tall ? mr + 100 : 0, ly = tall ? 0 : -(mr + 100);
    pos.push({ hub: { name: "Ohne Access Point", role: "lost" }, x: lx, y: ly });
    dots.push(...place(lx, ly, lost).map((d) => ({ ...d, hub: null })));
  }
  const xs = [...pos, ...dots].map((d) => d.x), ys = [...pos, ...dots].map((d) => d.y), pad = 50;
  return { pos, dots, box: { x: Math.min(...xs) - pad, y: Math.min(...ys) - pad, w: Math.max(...xs) - Math.min(...xs) + 2 * pad, h: Math.max(...ys) - Math.min(...ys) + 2 * pad } };
}
function radialHtml() {
  const L = radialLayout();
  if (!S.vb) { const b = L.box, m = 760; S.vb = b.w < m ? { x: b.x - (m - b.w) / 2, y: b.y - (m - b.h) / 2, w: m, h: Math.max(b.h, m) } : { ...b }; }
  const hub = (h) => L.pos.find((p) => p.hub === h);
  const lines = [
    ...L.pos.slice(1).filter((p) => p.hub.uplink).map((p) => `<path class="ln up ${p.hub.uplink.type}" d="M0,0 L${p.x},${p.y}"/>`),

/* ================= Gerät (Vollseite) ================= */

/* ================= Aktualisieren ================= */
function setHtml(id, html) { const el = document.getElementById(id); if (el && el.__h !== html) { el.innerHTML = html; el.__h = html; } }
function updateList() {

  setHtml("groupbar", groupbarHtml());
  setHtml("menuhost", menuHtml());

}
function updateDetail() {

/* ================= Navigation (Hash-Routen wie im Panel) ================= */
function route() {
  const h = location.hash;
  const m = /^#\/device\/([0-9a-f]{12})$/.exec(h);
  const prevSel = S.sel;
  S.sel = m && byId(m[1]) ? m[1] : null;
  S.tab = h === "#/cleanup" ? "cleanup" : h === "#/filter" ? "filter" : "net";
  shell();
  const vp = document.getElementById("vp");
  if (S.sel && S.sel !== prevSel) { vp.scrollTop = 0; document.getElementById("dtitle")?.focus({ preventScroll: true }); }
  else if (!S.sel && prevSel) {
    vp.scrollTop = S.listScroll;
    document.querySelector(`[data-dev="${prevSel}"]`)?.focus({ preventScroll: true });
  }
}
function openDevice(id, replace = false) {
  if (!S.sel) S.listScroll = document.getElementById("vp")?.scrollTop ?? 0;
  if (replace || S.sel) location.replace(`#/device/${id}`);
  else { S.openedHere = true; location.hash = `#/device/${id}`; }
}
function closeDevice() { if (S.openedHere) { S.openedHere = false; history.back(); } else location.hash = "#/"; }

/* ================= Ereignisse ================= */
let toastTimer;

function setMenu(open, focusFirst = false) {
  S.menu = open; updateList();
  if (open && focusFirst) document.querySelector("#fmenu [role=menuitemradio]")?.focus();
  if (!open) document.getElementById("morebtn")?.focus();
}
frame.addEventListener("click", (e) => {
  const el = e.target.closest("button, [data-act], g[data-dev]");
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (d.tab) { location.hash = d.tab === "net" ? "#/" : `#/${d.tab}`; return; }
  if (d.dev) { if (el.closest("#radsvg") && moved) return; S.hl = null; openDevice(d.dev); return; }
  if (d.go) { openDevice(d.go, true); return; }
  if (el.id === "morebtn") { setMenu(!S.menu, true); return; }
  if (d.filter) {
    const fromMenu = Boolean(el.closest("#fmenu")); S.filter = d.filter; S.menu = false; S.closed.clear(); updateList();
    (fromMenu ? document.getElementById("morebtn") : document.querySelector(`#filters [data-filter="${CSS.escape(d.filter)}"]`))?.focus();
    return;
  }
  if (d.view) { S.view = d.view; renderMain(); document.querySelector(`.viewsw [data-view="${d.view}"]`)?.focus(); return; }
  if (d.zoom) {
    if (d.zoom === "fit") { S.vb = null; updateList(); return; }
    zoomAt(d.zoom === "in" ? 1.4 : 1 / 1.4, S.vb.x + S.vb.w / 2, S.vb.y + S.vb.h / 2); return;
  }
  if (d.ap) { S.closed.has(d.ap) ? S.closed.delete(d.ap) : S.closed.add(d.ap); updateList(); document.querySelector(`[data-ap="${CSS.escape(d.ap)}"]`)?.focus(); return; }
  const c = S.sel && byId(S.sel);
  if (d.sw && c) {
    if (d.sw === "wan") { c.wan = !c.wan; toast(c.wan ? `${c.name}: Internet freigegeben` : `${c.name}: Internet gesperrt`); }

    updateDetail(); return;
  }
  if (d.enable && c) {
    const keys = d.enable === "all" ? ["priority", "profile", "wol"].filter((k) => !c.ents[k]) : [d.enable];
    keys.forEach((k) => S.enabling.add(c.id + k)); updateDetail();
    setTimeout(() => { keys.forEach((k) => { c.ents[k] = true; S.enabling.delete(c.id + k); }); updateDetail(); toast(keys.length > 1 ? `${keys.length} Entitäten eingeschaltet` : "Entität eingeschaltet"); }, 1600);

    case "showmap": {

    }
    case "bulk": {
      const id = S.filter.slice(6); const m = CLIENTS.filter((x) => x.labels.includes(id)); const block = m.every((x) => x.wan);
      m.forEach((x) => (x.wan = !block)); toast(`${m.length} Geräte ${block ? "gesperrt" : "freigegeben"} (im Panel mit Bestätigungsdialog)`); updateList(); return;
    }

    case "ha": toast("Öffnet /config/devices/device/…"); return;
    case "logbook": case "history": toast("Öffnet Logbuch/Verlauf, gefiltert auf das Gerät"); return;

frame.addEventListener("input", (e) => { if (e.target.id === "q") { S.query = e.target.value; updateList(); } });

document.addEventListener("keydown", (e) => {
  const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
  if (S.menu && document.getElementById("fmenu")?.contains(e.target)) {
    const items = [...document.querySelectorAll("#fmenu [role=menuitemradio]")]; const i = items.indexOf(e.target);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); return; }
    if (e.key === "Home") { e.preventDefault(); items[0].focus(); return; }

  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("g[data-dev]")) { e.preventDefault(); moved = false; openDevice(e.target.dataset.dev); return; }
  if (inField) return;
  if (e.key === "/" && S.tab === "net") { e.preventDefault(); if (S.sel) closeDevice(); setTimeout(() => document.getElementById("q")?.focus(), 0); }
  if (S.sel && (e.key === "j" || e.key === "k")) { const b = document.querySelector(`[data-k="${e.key === "j" ? "next" : "prev"}"]`); if (b && !b.disabled) b.click(); }
  if (document.activeElement?.closest?.("#radsvg") && ["+", "-"].includes(e.key)) zoomAt(e.key === "+" ? 1.4 : 1 / 1.4, S.vb.x + S.vb.w / 2, S.vb.y + S.vb.h / 2);
});
window.addEventListener("hashchange", route);
