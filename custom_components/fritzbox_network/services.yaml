set_name:
  target:
    entity:
      integration: fritzbox_network
  fields:
    name:
      required: true
      example: Living room TV
      selector:
        text:

wake_on_lan:
  target:
    entity:
      integration: fritzbox_network

set_route:
  fields:
    network:
      required: true
      example: 10.8.0.0/24
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

capture:
  target:
    entity:
      integration: fritzbox_network
  fields:
    interface:
      default: 1-lan
      example: 1-lan
      selector:
        text:
    duration:
      default: 60
      selector:
        number:
          min: 5
          max: 600
          unit_of_measurement: s
    size:
      default: 50
      selector:
        number:
          min: 1
          max: 200
          unit_of_measurement: MB

remove_unavailable_vpn:
