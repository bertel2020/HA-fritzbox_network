blueprint:
  name: FRITZ!Box Network – internet access schedule
  description: >-
    Blocks the internet access of devices at one time and allows it again at
    another, for example for a child's tablet at night. Needs the right
    "FRITZ!Box settings" for the integration's user. If the address of a device
    changed since the last update, the box is not switched for that device and the
    run reports an error. Nothing happens at startup, so a restart during the
    blocked period leaves the access as it is.
  domain: automation
  author: bertel2020
  source_url: https://github.com/bertel2020/HA-fritzbox_network/blob/main/blueprints/automation/fritzbox_network/internet_schedule.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    devices:
      name: Devices
      description: >-
        The "Internet access" switches of the devices to schedule. Leave it empty
        if you use a group below.
      default: []
      selector:
        entity:
          domain: switch
          integration: fritzbox_network
          multiple: true
    group:
      name: Group (label)
      description: >-
        A label that you put on the "Internet access" switches, for example "Kids".
        Every such switch of this integration is scheduled, also ones you add later.
        You can set groups in the side panel of the integration.
      default: ""
      selector:
        label:
    block_time:
      name: Block at
      default: "21:00:00"
      selector:
        time:
    allow_time:
      name: Allow at
      default: "07:00:00"
      selector:
        time:
    weekdays:
      name: Days
      description: On which days the blocking and the allowing happen.
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - { label: Monday, value: mon }
            - { label: Tuesday, value: tue }
            - { label: Wednesday, value: wed }
            - { label: Thursday, value: thu }
            - { label: Friday, value: fri }
            - { label: Saturday, value: sat }
            - { label: Sunday, value: sun }

mode: queued
max: 4

variables:
  device_switches: !input devices
  group_label: !input group
  # the chosen switches and every "Internet access" switch with the label, once each
  switches: >-
    {% set labelled = label_entities(group_label) if group_label else [] %}
    {{ (device_switches + (labelled | select('in', integration_entities('fritzbox_network')) | select('match', 'switch\\.') | list)) | unique | list }}

triggers:
  - trigger: time
    at: !input block_time
    id: block
  - trigger: time
    at: !input allow_time
    id: allow

conditions:
  - condition: time
    weekday: !input weekdays

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: block
        sequence:
          - condition: template
            value_template: "{{ switches | count > 0 }}"
          - action: switch.turn_off
            target:
              entity_id: "{{ switches }}"
      - conditions:
          - condition: trigger
            id: allow
        sequence:
          - condition: template
            value_template: "{{ switches | count > 0 }}"
          - action: switch.turn_on
            target:
              entity_id: "{{ switches }}"
